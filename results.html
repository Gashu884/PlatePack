<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved Logs - PlatePack</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        color: #0f172a;
      }
      header {
        max-width: 1100px;
        margin: 0 auto 1.25rem;
        display: grid;
        gap: 0.5rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.4vw, 2.1rem);
      }
      .muted {
        margin: 0;
        color: #64748b;
        line-height: 1.4;
      }
      .notice {
        padding: 0.75rem 0.9rem;
        border-radius: 14px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        color: #9a3412;
        line-height: 1.4;
        font-size: 0.95rem;
      }
      .toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        border: none;
        border-radius: 12px;
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #dbeafe;
        color: #1e293b;
      }
      .btn.secondary {
        background: #e2e8f0;
      }
      .btn.danger {
        background: #fee2e2;
        color: #7f1d1d;
      }
      .panel {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        border: 1px solid #e6eefc;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 1rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 720px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1040px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .item {
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        overflow: hidden;
        display: grid;
        background: #fff;
      }
      details.item {
        display: block;
      }
      summary.item-summary {
        list-style: none;
        cursor: pointer;
        padding: 0.75rem 0.8rem;
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      summary.item-summary::-webkit-details-marker {
        display: none;
      }
      .badge {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #eef2ff;
        display: grid;
        place-items: center;
        font-weight: 900;
        color: #3730a3;
        flex: 0 0 auto;
      }
      .summary-text {
        min-width: 0;
        display: grid;
        gap: 0.2rem;
      }
      .summary-actions {
        margin-left: auto;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .thumb {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        background: #f8fafc;
      }
      .meta {
        padding: 0.75rem 0.8rem;
        display: grid;
        gap: 0.4rem;
      }
      .meta .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .title {
        font-weight: 800;
        color: #0f172a;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub {
        color: #64748b;
        font-size: 0.85rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.25rem;
      }
      .empty {
        color: #64748b;
        padding: 1rem;
      }
      code {
        background: #eef2ff;
        padding: 0.05rem 0.3rem;
        border-radius: 6px;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>保存したログ</h1>
      <p class="muted">
        <code>PlatesPacker</code> の <code>Save Log</code> で保存した入力/出力レイアウト設定を一覧できます。
      </p>
      <div id="notice" class="notice" style="display:none;"></div>
      <div class="toolbar">
        <a class="btn secondary" href="/">ホームへ</a>
        <a class="btn" href="/plates">PlatesPackerへ</a>
        <button type="button" class="btn" id="importBtn">Import JSON</button>
        <input type="file" id="importInput" accept="application/json,.json" style="display:none;" />
        <button type="button" class="btn danger" id="clearAllBtn">全削除</button>
      </div>
    </header>

    <main class="panel">
      <div id="list" class="grid"></div>
      <div id="empty" class="empty" style="display:none;">保存されたログがありません。</div>
    </main>

    <script>
      const API_LIST = "/api/logs";
      const API_ITEM = (id) => `/api/logs/${encodeURIComponent(id)}`;
      const listEl = document.getElementById("list");
      const emptyEl = document.getElementById("empty");
      const noticeEl = document.getElementById("notice");
      const clearAllBtn = document.getElementById("clearAllBtn");
      const importBtn = document.getElementById("importBtn");
      const importInput = document.getElementById("importInput");
      const LOCAL_LOG_KEY = "PLATEPACK_LOCAL_LOGS_V1";

      function formatDate(iso) {
        try {
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return iso;
          return d.toLocaleString();
        } catch {
          return iso;
        }
      }

      function safeParseJson(raw, fallback) {
        try {
          return JSON.parse(raw);
        } catch {
          return fallback;
        }
      }

      function listLocalLogs() {
        try {
          const raw = localStorage.getItem(LOCAL_LOG_KEY);
          const parsed = raw ? safeParseJson(raw, []) : [];
          const items = Array.isArray(parsed) ? parsed : [];
          return items.filter((x) => x && typeof x === "object" && typeof x.id === "string");
        } catch {
          return [];
        }
      }

      function writeLocalLogs(items) {
        try {
          localStorage.setItem(LOCAL_LOG_KEY, JSON.stringify(items));
        } catch {
          // ignore quota / privacy errors
        }
      }

      function saveLocalLog(name, payload) {
        const id = `${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const created_at = new Date().toISOString();
        const items = listLocalLogs();
        items.unshift({ id, name: String(name || "Log"), created_at, payload: payload || {} });
        writeLocalLogs(items.slice(0, 200));
        return { id, name: String(name || "Log"), created_at };
      }

      function getLocalLog(id) {
        const items = listLocalLogs();
        return items.find((x) => x && typeof x === "object" && x.id === id) || null;
      }

      async function deleteLog(source, id) {
        if (source === "local") {
          const next = listLocalLogs().filter((x) => x.id !== id);
          writeLocalLogs(next);
          return;
        }
        const res = await fetch(API_ITEM(id), { method: "DELETE" });
        if (!res.ok) throw new Error("delete failed");
      }

      function downloadJson(filename, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename || "platepack_log.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      async function downloadLog(source, id, name) {
        if (source === "local") {
          const entry = getLocalLog(id);
          if (!entry) throw new Error("not found");
          const safe = String(name || "log").replace(/[^a-zA-Z0-9_-]+/g, "_");
          downloadJson(`platepack_log_${safe}_local_${id}.json`, {
            id: entry.id,
            name: entry.name,
            created_at: entry.created_at,
            payload: entry.payload || {},
          });
          return;
        }
        const res = await fetch(API_ITEM(id));
        if (!res.ok) throw new Error("fetch failed");
        const data = await res.json();
        const safe = String(name || "log").replace(/[^a-zA-Z0-9_-]+/g, "_");
        downloadJson(`platepack_log_${safe}_${id}.json`, data);
      }

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error || new Error("read failed"));
          reader.readAsText(file);
        });
      }

      async function importJsonFile(file) {
        const text = await readFileAsText(file);
        const parsed = JSON.parse(text);
        const payload =
          parsed && typeof parsed === "object" && parsed.payload && typeof parsed.payload === "object"
            ? parsed.payload
            : parsed && typeof parsed === "object"
              ? parsed
              : null;
        if (!payload || typeof payload !== "object") {
          throw new Error("invalid payload");
        }
        const defaultName =
          (parsed && typeof parsed === "object" && typeof parsed.name === "string" && parsed.name.trim()) ||
          (file?.name ? file.name.replace(/\\.json$/i, "") : "") ||
          `Imported ${new Date().toLocaleString()}`;
        const name = prompt("ログ名を入力してください:", defaultName);
        if (!name) return;
        try {
          const res = await fetch(API_LIST, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, payload }),
          });
          if (res.ok) return;
          if (res.status === 503) {
            saveLocalLog(name, payload);
            return;
          }
          throw new Error("import failed");
        } catch {
          saveLocalLog(name, payload);
        }
      }

      async function render() {
        listEl.innerHTML = "";
        emptyEl.style.display = "none";
        if (noticeEl) noticeEl.style.display = "none";

        let serverItems = [];
        let serverError = "";
        try {
          const res = await fetch(API_LIST);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            serverError = err?.detail || `HTTP ${res.status}`;
            serverItems = [];
          } else {
            serverItems = (await res.json()) || [];
            if (!Array.isArray(serverItems)) serverItems = [];
          }
        } catch (e) {
          serverItems = [];
          serverError = e && typeof e === "object" && "message" in e ? String(e.message || "") : "";
        }

        const localItems = listLocalLogs()
          .map((x) => ({
            source: "local",
            id: x.id,
            name: x.name || "Log",
            created_at: x.created_at || "",
          }))
          .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));

        const normalizedServer = serverItems.map((x) => ({
          source: "server",
          id: x?.id || "",
          name: x?.name || "Log",
          created_at: x?.created_at || "",
        }));

        if (noticeEl && serverError) {
          noticeEl.textContent =
            "サーバー側の永続DBが未設定/利用不可のため、このページではブラウザ内のローカルログを表示・保存します。"
              + (serverError ? ` (${serverError})` : "");
          noticeEl.style.display = "block";
        }

        const items = [...normalizedServer, ...localItems].filter((x) => x.id);
        listEl.innerHTML = "";
        emptyEl.style.display = items.length ? "none" : "block";
        if (!items.length) return;

        items.forEach((item) => {
          const card = document.createElement("details");
          card.className = "item";

          const summary = document.createElement("summary");
          summary.className = "item-summary";

          const badge = document.createElement("div");
          badge.className = "badge";
          badge.textContent = item?.source === "local" ? "LOCAL" : "DB";

          const summaryText = document.createElement("div");
          summaryText.className = "summary-text";

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = item?.name || "Log";

          const sub = document.createElement("div");
          sub.className = "sub";
          sub.textContent = item?.created_at ? formatDate(item.created_at) : "";

          summaryText.appendChild(title);
          summaryText.appendChild(sub);

          const summaryActions = document.createElement("div");
          summaryActions.className = "summary-actions";

          const expandBtn = document.createElement("button");
          expandBtn.type = "button";
          expandBtn.className = "btn secondary";
          expandBtn.textContent = "展開";
          expandBtn.addEventListener("click", (ev) => {
            ev.preventDefault();
            card.open = !card.open;
          });

          summaryActions.appendChild(expandBtn);

          summary.appendChild(badge);
          summary.appendChild(summaryText);
          summary.appendChild(summaryActions);

          const meta = document.createElement("div");
          meta.className = "meta";

          const actions = document.createElement("div");
          actions.className = "actions";

          const open = document.createElement("a");
          open.className = "btn";
          open.href =
            item?.source === "local"
              ? `/plates?log=${encodeURIComponent(`local:${item?.id || ""}`)}`
              : `/plates?log=${encodeURIComponent(item?.id || "")}`;
          open.textContent = "PlatesPackerで開く";

          const dl = document.createElement("button");
          dl.type = "button";
          dl.className = "btn secondary";
          dl.textContent = "Download JSON";
          dl.addEventListener("click", async () => {
            try {
              await downloadLog(item?.source, item?.id, item?.name);
            } catch {
              alert("ダウンロードに失敗しました。");
            }
          });

          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn danger";
          del.textContent = "削除";
          del.addEventListener("click", async () => {
            if (!confirm("このログを削除します。よろしいですか？")) return;
            try {
              await deleteLog(item?.source, item?.id);
              await render();
            } catch {
              alert("削除に失敗しました。");
            }
          });

          actions.appendChild(open);
          actions.appendChild(dl);
          actions.appendChild(del);

          const row = document.createElement("div");
          row.className = "row";
          const idTag = document.createElement("div");
          idTag.className = "sub";
          idTag.textContent = `id: ${item?.id || ""}`;
          row.appendChild(idTag);
          meta.appendChild(row);
          meta.appendChild(actions);

          card.appendChild(summary);
          card.appendChild(meta);
          listEl.appendChild(card);
        });
      }

      clearAllBtn.addEventListener("click", () => {
        alert("全削除は未対応です（DB永続化のため）。個別に削除してください。");
      });

      importBtn.addEventListener("click", () => importInput.click());
      importInput.addEventListener("change", async () => {
        const file = importInput.files && importInput.files[0];
        importInput.value = "";
        if (!file) return;
        try {
          await importJsonFile(file);
          await render();
        } catch {
          alert("JSONの読み込み/保存に失敗しました。");
        }
      });

      render();
    </script>
  </body>
</html>
