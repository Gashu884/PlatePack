<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plates Packer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        color: #0f172a;
      }
      header {
        margin-bottom: 1.75rem;
        display: grid;
        gap: 0.4rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.4rem);
      }
      .muted {
        color: #64748b;
        font-size: 0.95rem;
      }
      .layout {
        display: grid;
        gap: 1.8rem;
      }
      .panel {
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 28px 60px rgba(15, 23, 42, 0.1);
        padding: clamp(1.4rem, 3vw, 2.1rem);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        align-items: center;
      }
      .controls:first-of-type {
        margin-right: 1.25rem;
      }
      .toolbar .controls:nth-of-type(2) {
        margin-left: 0.5rem;
      }
      label {
        font-weight: 600;
        margin-right: 0.4rem;
      }
      select {
        border-radius: 16px;
        border: 1px solid #cbd5f5;
        padding: 0.7rem 1.4rem;
        font-family: inherit;
        background: #f0f9ff;
        font-size: 1.15rem;
        min-width: 200px;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 0.7rem 1.2rem;
        font-weight: 600;
        font-size: 0.94rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button.primary {
        background: linear-gradient(135deg, #2563eb, #4338ca);
        color: #fff;
      }
      button.ghost {
        background: #e2e8f0;
        color: #1e293b;
      }
      button.success {
        background: #10b981;
        color: #fff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .plate-summary {
        font-size: 0.95rem;
        color: #1e293b;
        margin-top: 0.5rem;
      }
      .well-grid {
        margin-top: 1.2rem;
        display: grid;
        gap: 0.36rem;
        max-width: 580px;
      }
      .column-header,
      .well-row {
        display: grid;
        grid-template-columns: 38px repeat(12, minmax(24px, 1fr));
        gap: 0.22rem;
        align-items: center;
      }
      .corner-cell {
        width: 38px;
        height: 38px;
      }
      .header-btn {
        border-radius: 8px;
        border: 1px solid #cbd5f5;
        background: #e0f2fe;
        font-weight: 600;
        color: #1e3a8a;
        font-size: 0.78rem;
        padding: 0.3rem 0.4rem;
        cursor: pointer;
        transition: background 0.12s ease, box-shadow 0.12s ease;
      }
      .header-btn.row {
        background: #f1f5f9;
        color: #475569;
      }
      .header-btn:hover {
        box-shadow: 0 8px 18px rgba(14, 116, 144, 0.2);
        background: #bae6fd;
      }
      .well-btn {
        border-radius: 9px;
        border: 1px solid #cbd5f5;
        background: #fff;
        font-size: 0.72rem;
        padding: 0.22rem;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
      }
      .well-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.22);
      }
      .well-btn.selected {
        background: #22c55e;
        color: #fff;
        border-color: #15803d;
        box-shadow: 0 10px 18px rgba(34, 197, 94, 0.35);
      }
      .pack-buttons {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }
      .status {
        margin-top: 1rem;
        color: #64748b;
        font-size: 0.9rem;
        min-height: 1.2rem;
      }
      .packed-section {
        display: grid;
        gap: 1.25rem;
      }
      .packed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .packed-info {
        font-size: 0.95rem;
        color: #1e293b;
        font-weight: 600;
      }
      .packed-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .packed-grid {
        overflow-x: auto;
        max-width: 580px;
      }
      .packed-table {
        border-collapse: collapse;
        border-spacing: 0;
        background: #fff;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #d1d5db;
      }
      .packed-table thead th:first-child {
        width: 34px;
      }
      .packed-table th,
      .packed-table td {
        border: 1px solid #d5deff;
        width: 38px;
        height: 38px;
        text-align: center;
        font-size: 0.72rem;
        padding: 0;
      }
      .packed-table th {
        background: #e8f1ff;
        font-weight: 600;
        color: #475569;
      }
      .packed-table th.row-header {
        background: #eef2ff;
      }
      .packed-cell {
        width: 38px;
        height: 38px;
        position: relative;
        overflow: hidden;
      }
      .packed-cell span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        border-radius: 0;
        color: #1f2937;
      }
      .packed-cell.active {
        background: transparent;
      }
      .packed-table-wrapper {
        position: relative;
        display: inline-block;
      }
      .plate-outline {
        position: absolute;
        pointer-events: none;
        mix-blend-mode: multiply;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Plates Packer</h1>
      <p class="muted">96wellプレートの該当wellをクリックし、パッキング結果を新しいプレートとして表示します。</p>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="toolbar">
          <div class="controls">
            <label for="plateCount">Number of Plates</label>
            <select id="plateCount">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="custom">Custom…</option>
            </select>
          </div>
          <div class="controls">
            <button type="button" class="ghost" id="prevPlateBtn">Previous</button>
            <button type="button" class="ghost" id="nextPlateBtn">Next</button>
            <button type="button" class="ghost" id="clearPlateBtn">Clear</button>
          </div>
        </div>

        <div class="plate-summary" id="plateSummary">Plate 1 — 0 wells selected · Plate 1 of 1</div>
        <h2 id="plateTitle" style="margin:0.9rem 0 1.1rem;">Plate 1</h2>

        <div class="well-grid">
          <div class="column-header" id="columnHeader"></div>
          <div id="wellGrid"></div>
        </div>

        <div class="pack-buttons">
          <button type="button" class="primary" id="packColumnBtn">Packing! (by Column)</button>
          <button type="button" class="primary" id="packRowBtn">Packing! (by Row)</button>
        </div>

        <div class="status" id="status"></div>
      </section>

      <section class="panel">
        <div class="packed-section">
          <div class="packed-header">
            <div class="packed-info" id="packedSummary">Packed Plate 0 of 0</div>
            <div class="packed-controls">
              <button type="button" class="ghost" id="prevPackedBtn" disabled>Previous</button>
              <button type="button" class="ghost" id="nextPackedBtn" disabled>Next</button>
              <button type="button" class="success" id="downloadBtn" disabled>Download HTML</button>
            </div>
          </div>
          <div class="packed-grid" id="packedGrid">
            <p class="muted">まだパッキング結果はありません。</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      const ROWS = ["A", "B", "C", "D", "E", "F", "G", "H"];
      const COLS = Array.from({ length: 12 }, (_, i) => i + 1);
      const API_ENDPOINT = "/generate-html";

      let plates = [createPlate(1)];
      let currentPlateIndex = 0;
      let packedPlates = [];
      let currentPackedIndex = 0;
      let lastHtml = "";
      let sourceColorMap = new Map();

      const plateCountSelect = document.getElementById("plateCount");
      const plateSummary = document.getElementById("plateSummary");
      const plateTitle = document.getElementById("plateTitle");
      const columnHeader = document.getElementById("columnHeader");
      const wellGrid = document.getElementById("wellGrid");
      const prevPlateBtn = document.getElementById("prevPlateBtn");
      const nextPlateBtn = document.getElementById("nextPlateBtn");
      const clearPlateBtn = document.getElementById("clearPlateBtn");
      const packColumnBtn = document.getElementById("packColumnBtn");
      const packRowBtn = document.getElementById("packRowBtn");
      const statusEl = document.getElementById("status");
      const packedSummary = document.getElementById("packedSummary");
      const packedGrid = document.getElementById("packedGrid");
      const prevPackedBtn = document.getElementById("prevPackedBtn");
      const nextPackedBtn = document.getElementById("nextPackedBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      function createPlate(index) {
        return { label: `Plate ${index}`, wells: new Set() };
      }

      function getCurrentPlate() {
        return plates[currentPlateIndex];
      }

      function parseWell(well) {
        const match = well.match(/^([A-H])(\d{1,2})$/);
        if (!match) return null;
        return { row: match[1], col: Number(match[2]) };
      }

      function resizePlateCount(count) {
        if (count > plates.length) {
          const len = plates.length;
          for (let i = len; i < count; i += 1) {
            plates.push(createPlate(i + 1));
          }
        } else if (count < plates.length) {
          plates = plates.slice(0, count);
          currentPlateIndex = Math.min(currentPlateIndex, plates.length - 1);
        }
        renderPlate();
      }

      function ensurePlateOption(value) {
        const valueStr = String(value);
        const options = Array.from(plateCountSelect.options);
        if (options.some((option) => option.value === valueStr)) return;
        const option = document.createElement("option");
        option.value = valueStr;
        option.textContent = valueStr;
        const customOption = plateCountSelect.querySelector('option[value="custom"]');
        plateCountSelect.insertBefore(option, customOption);
      }

      function renderGridStructure() {
        columnHeader.innerHTML = "";
        const corner = document.createElement("div");
        corner.className = "corner-cell";
        columnHeader.appendChild(corner);
        COLS.forEach((col) => {
          const colBtn = document.createElement("button");
          colBtn.type = "button";
          colBtn.className = "header-btn";
          colBtn.textContent = col;
          colBtn.addEventListener("click", () => toggleColumn(col));
          columnHeader.appendChild(colBtn);
        });

        wellGrid.innerHTML = "";
        ROWS.forEach((row) => {
          const rowDiv = document.createElement("div");
          rowDiv.className = "well-row";
          const rowBtn = document.createElement("button");
          rowBtn.type = "button";
          rowBtn.className = "header-btn row";
          rowBtn.textContent = row;
          rowBtn.addEventListener("click", () => toggleRow(row));
          rowDiv.appendChild(rowBtn);

          COLS.forEach((col) => {
            const wellId = `${row}${col}`;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "well-btn";
            btn.dataset.well = wellId;
            btn.textContent = `${col}${row}`;
            btn.addEventListener("click", () => toggleWell(wellId));
            rowDiv.appendChild(btn);
          });

          wellGrid.appendChild(rowDiv);
        });
      }

      function updateWellButtons() {
        const plate = getCurrentPlate();
        document.querySelectorAll(".well-btn").forEach((btn) => {
          const well = btn.dataset.well;
          if (plate.wells.has(well)) {
            btn.classList.add("selected");
          } else {
            btn.classList.remove("selected");
          }
        });
      }

      function renderPlate() {
        const plate = getCurrentPlate();
        plateTitle.textContent = plate.label;
        plateSummary.textContent = `${plate.label} — ${plate.wells.size} wells selected · Plate ${
          currentPlateIndex + 1
        } of ${plates.length}`;
        updateWellButtons();
      }

      function toggleWell(well) {
        const plate = getCurrentPlate();
        if (plate.wells.has(well)) {
          plate.wells.delete(well);
        } else {
          plate.wells.add(well);
        }
        renderPlate();
      }

      function clearPlate() {
        getCurrentPlate().wells.clear();
        renderPlate();
      }

      function toggleRow(letter) {
        const upper = String(letter).trim().toUpperCase();
        if (!ROWS.includes(upper)) return;
        const plate = getCurrentPlate();
        const wells = COLS.map((col) => `${upper}${col}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) plate.wells.delete(well);
          else plate.wells.add(well);
        });
        renderPlate();
      }

      function toggleColumn(colValue) {
        const num = Number(colValue);
        if (!Number.isInteger(num) || num < 1 || num > 12) return;
        const plate = getCurrentPlate();
        const wells = ROWS.map((row) => `${row}${num}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) plate.wells.delete(well);
          else plate.wells.add(well);
        });
        renderPlate();
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = `status${isError ? " error" : ""}`;
      }

      function buildPayload(order) {
        const sortedSources = plates.map((plate, index) => {
          const wellsArray = Array.from(plate.wells);
          wellsArray.sort((a, b) => {
            const parsedA = parseWell(a);
            const parsedB = parseWell(b);
            if (!parsedA || !parsedB) return 0;
            if (order === "column") {
              return parsedA.col === parsedB.col
                ? parsedA.row.localeCompare(parsedB.row)
                : parsedA.col - parsedB.col;
            }
            return parsedA.row === parsedB.row
              ? parsedA.col - parsedB.col
              : parsedA.row.localeCompare(parsedB.row);
          });
          return {
            plate_id: `${String(index + 1).padStart(1, "0")}`,
            wells: wellsArray,
          };
        });

        const flattened = sortedSources.flatMap((src) =>
          src.wells.map((well) => ({ source_plate: src.plate_id, source_well: well }))
        );

        const wellsPerPlate = ROWS.length * COLS.length;
        const destinations = [];
        const orderedAssignments = [];

        flattened.forEach((item, index) => {
          const destPlateIndex = Math.floor(index / wellsPerPlate);
          const pos = index % wellsPerPlate;
          const destRowIndex =
            order === "column" ? pos % ROWS.length : Math.floor(pos / COLS.length);
          const destColIndex =
            order === "column" ? Math.floor(pos / ROWS.length) : pos % COLS.length;
          const destPlateId = `DEST-${String(destPlateIndex + 1).padStart(3, "0")}`;
          const destWell = `${ROWS[destRowIndex]}${COLS[destColIndex]}`;

          orderedAssignments.push({
            source_plate: item.source_plate,
            source_well: item.source_well,
            destination_plate: destPlateId,
            destination_well: destWell,
          });
        });

        const totalDest = Math.max(1, Math.ceil(flattened.length / wellsPerPlate));
        for (let i = 0; i < totalDest; i += 1) {
          const plateId = `DEST-${String(i + 1).padStart(3, "0")}`;
          destinations.push({
            plate_id: plateId,
            rows: ROWS.length,
            cols: COLS.length,
            assignments: orderedAssignments
              .filter((assign) => assign.destination_plate === plateId)
              .map((assign) => ({
                well: assign.destination_well,
                source_plate: assign.source_plate,
                source_well: assign.source_well,
              })),
          });
        }

        return {
          title: "Plates Packing Report",
          sources: sortedSources,
          destinations,
          plan: orderedAssignments,
        };
      }

      async function pack(order) {
        try {
          setStatus("");
      const payload = buildPayload(order);
      const selectionCount = payload.plan.length;
      if (selectionCount === 0) {
        setStatus("ウェルを選択してください。", true);
        return;
      }
      sourceColorMap = new Map();
      const pastelPalette = [
        "#c7d2fe",
        "#bfdbfe",
        "#bbf7d0",
        "#fbcfe8",
        "#fde68a",
        "#c8e7ff",
        "#fed7aa",
        "#e9d5ff",
        "#d9f99d",
        "#fcd6f6"
      ];
      payload.sources.forEach((src, idx) => {
        sourceColorMap.set(src.plate_id, pastelPalette[idx % pastelPalette.length]);
      });
          const res = await fetch(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const text = await res.text();
          if (!res.ok) {
            setStatus(`API error (${res.status})`, true);
            return;
          }
          lastHtml = text;
      downloadBtn.disabled = false;

      packedPlates = payload.destinations.map((plate) => {
        const regions = new Map();
        const grid = Array.from({ length: ROWS.length }, () =>
          Array.from({ length: COLS.length }, () => null)
        );
        plate.assignments.forEach((assignment) => {
          const parsed = parseWell(assignment.well);
          if (!parsed) return;
          const rowIdx = ROWS.indexOf(parsed.row);
          const colIdx = COLS.indexOf(parsed.col);
          grid[rowIdx][colIdx] = {
            sourcePlate: assignment.source_plate,
            sourceWell: assignment.source_well,
            color: sourceColorMap.get(assignment.source_plate)
          };
          const key = assignment.source_plate;
          if (!regions.has(key)) {
            regions.set(key, {
              sourcePlate: key,
              color: sourceColorMap.get(key),
              minRow: rowIdx,
              maxRow: rowIdx,
              minCol: colIdx,
              maxCol: colIdx
            });
          } else {
            const region = regions.get(key);
            region.minRow = Math.min(region.minRow, rowIdx);
            region.maxRow = Math.max(region.maxRow, rowIdx);
            region.minCol = Math.min(region.minCol, colIdx);
            region.maxCol = Math.max(region.maxCol, colIdx);
          }
        });
        return { id: plate.plate_id, grid, regions: Array.from(regions.values()) };
      });
      currentPackedIndex = 0;
        renderPacked();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function shadowForColor(color) {
      if (color.startsWith("#") && color.length === 7) {
        const r = parseInt(color.slice(1, 3), 16);
        const g = parseInt(color.slice(3, 5), 16);
        const b = parseInt(color.slice(5, 7), 16);
        return `0 6px 12px rgba(${r}, ${g}, ${b}, 0.28)`;
      }
      return "0 6px 12px rgba(15, 23, 42, 0.2)";
    }

    function formatWellDisplay(well) {
      const parsed = parseWell(well);
      if (!parsed) return well;
      return `${parsed.col}${parsed.row}`;
    }

      function renderPacked() {
        if (packedPlates.length === 0) {
          packedSummary.textContent = "Packed Plate 0 of 0";
          packedGrid.innerHTML = "<p class='muted'>まだパッキング結果はありません。</p>";
          prevPackedBtn.disabled = true;
          nextPackedBtn.disabled = true;
          return;
        }
        const plate = packedPlates[currentPackedIndex];
        packedSummary.textContent = `Packed Plate ${currentPackedIndex + 1} of ${packedPlates.length}`;

        const wrapper = document.createElement("div");
        wrapper.className = "packed-table-wrapper";
        const table = document.createElement("table");
        table.className = "packed-table";
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        headerRow.innerHTML = "<th></th>" + COLS.map((col) => `<th>${col}</th>`).join("");
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        ROWS.forEach((rowLabel, rowIndex) => {
          const tr = document.createElement("tr");
          const rowHeader = document.createElement("th");
          rowHeader.className = "row-header";
          rowHeader.textContent = rowLabel;
          tr.appendChild(rowHeader);
          COLS.forEach((_, colIndex) => {
            const td = document.createElement("td");
            td.className = "packed-cell";
            const well = `${rowLabel}${COLS[colIndex]}`;
            const cellData = plate.grid[rowIndex][colIndex];
            if (cellData) {
              td.classList.add("active");
              const color = cellData.color || sourceColorMap.get(cellData.sourcePlate) || "#dbeafe";
              const label = document.createElement("span");
              label.textContent = `${cellData.sourcePlate}-${formatWellDisplay(cellData.sourceWell)}`;
              label.style.background = color;
              label.style.boxShadow = shadowForColor(color);
              label.style.border = `2px solid rgba(0,0,0,0.25)`;
              td.appendChild(label);
              td.dataset.sourcePlate = cellData.sourcePlate;
              td.dataset.rowIndex = String(rowIndex);
              td.dataset.colIndex = String(colIndex);
            } else {
              td.dataset.rowIndex = String(rowIndex);
              td.dataset.colIndex = String(colIndex);
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrapper.appendChild(table);
        packedGrid.innerHTML = "";
        packedGrid.appendChild(wrapper);

        requestAnimationFrame(() => drawSourceOutlines(wrapper, plate.regions));

        prevPackedBtn.disabled = currentPackedIndex === 0;
        nextPackedBtn.disabled = currentPackedIndex >= packedPlates.length - 1;
      }

      function drawSourceOutlines(wrapper, regions) {
        wrapper.querySelectorAll('.plate-outline').forEach((el) => el.remove());
        const tableRect = wrapper.getBoundingClientRect();
        regions.forEach((region) => {
          const cells = Array.from(wrapper.querySelectorAll(`td[data-source-plate="${region.sourcePlate}"]`));
          if (!cells.length) return;
          let minLeft = Infinity;
          let minTop = Infinity;
          let maxRight = -Infinity;
          let maxBottom = -Infinity;
          cells.forEach((cell) => {
            const rect = cell.getBoundingClientRect();
            minLeft = Math.min(minLeft, rect.left);
            minTop = Math.min(minTop, rect.top);
            maxRight = Math.max(maxRight, rect.right);
            maxBottom = Math.max(maxBottom, rect.bottom);
          });
          const outline = document.createElement('div');
          outline.className = 'plate-outline';
          outline.style.left = `${minLeft - tableRect.left - 3}px`;
          outline.style.top = `${minTop - tableRect.top - 3}px`;
          outline.style.width = `${maxRight - minLeft + 6}px`;
          outline.style.height = `${maxBottom - minTop + 6}px`;
          outline.style.border = '3px solid #0f172a';
          outline.style.borderRadius = '12px';
          outline.style.background = 'rgba(15,23,42,0.02)';
          wrapper.appendChild(outline);
        });
      }

      function downloadHtml() {
        if (!lastHtml) return;
        const blob = new Blob([lastHtml], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "plates-report.html";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      // Event bindings
      plateCountSelect.addEventListener("change", (e) => {
        const value = e.target.value;
        if (value === "custom") {
          const input = prompt("Enter number of plates (1-999):", plates.length);
          if (input === null) {
            plateCountSelect.value = String(plates.length);
            return;
          }
          const num = Number(input);
          if (!Number.isInteger(num) || num < 1) {
            alert("Please enter a positive integer.");
            plateCountSelect.value = String(plates.length);
            return;
          }
          ensurePlateOption(num);
          plateCountSelect.value = String(num);
          resizePlateCount(num);
        } else {
          resizePlateCount(Number(value));
        }
      });
      prevPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex === 0) return;
        currentPlateIndex -= 1;
        renderPlate();
      });
      nextPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex >= plates.length - 1) return;
        currentPlateIndex += 1;
        renderPlate();
      });
      clearPlateBtn.addEventListener("click", clearPlate);
      packColumnBtn.addEventListener("click", () => pack("column"));
      packRowBtn.addEventListener("click", () => pack("row"));
      prevPackedBtn.addEventListener("click", () => {
        if (currentPackedIndex === 0) return;
        currentPackedIndex -= 1;
        renderPacked();
      });
      nextPackedBtn.addEventListener("click", () => {
        if (currentPackedIndex >= packedPlates.length - 1) return;
        currentPackedIndex += 1;
        renderPacked();
      });
      downloadBtn.addEventListener("click", downloadHtml);

      // Initial render
      renderGridStructure();
      renderPlate();
    </script>
  </body>
</html>
