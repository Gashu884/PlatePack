<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plates Packer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        color: #111827;
      }
      header {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.35rem);
      }
      .muted {
        color: #6b7280;
        font-size: 0.95rem;
      }
      .layout {
        display: grid;
        gap: 1.5rem;
      }
      .panel {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.08);
        padding: clamp(1.4rem, 3vw, 2rem);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.2rem;
      }
      .plate-info {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }
      label {
        font-weight: 600;
        margin-right: 0.6rem;
      }
      select {
        border-radius: 12px;
        border: 1px solid #d1d5db;
        padding: 0.55rem 0.9rem;
        font-family: inherit;
        background: #f9fafb;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 0.65rem 1.25rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button.primary {
        background: linear-gradient(135deg, #2563eb, #4338ca);
        color: #fff;
      }
      button.ghost {
        background: #e5e7eb;
        color: #374151;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .well-grid {
        display: grid;
        gap: 0.8rem;
      }
      .column-header,
      .well-row {
        display: grid;
        grid-template-columns: auto repeat(12, minmax(36px, 1fr));
        gap: 0.45rem;
        align-items: center;
      }
      .column-header span,
      .row-label {
        font-weight: 600;
        text-align: center;
        color: #6b7280;
      }
      .row-label {
        text-align: left;
        padding-left: 0.3rem;
      }
      .well-btn {
        border-radius: 11px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 0.83rem;
        padding: 0.55rem;
        transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
      }
      .well-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 20px rgba(37, 99, 235, 0.15);
      }
      .well-btn.selected {
        background: #22c55e;
        color: #fff;
        border-color: #15803d;
        box-shadow: 0 10px 16px rgba(34, 197, 94, 0.35);
      }
      .status {
        margin-top: 1rem;
        color: #6b7280;
        font-size: 0.92rem;
      }
      .canvas-container {
        margin-top: 1.5rem;
        display: grid;
        gap: 1rem;
      }
      canvas {
        width: min(620px, 100%);
        max-width: 100%;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.8rem;
      }
      .summary {
        font-size: 0.95rem;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Plates Packer</h1>
      <p class="muted">
        96 ウェルプレートのスロットをクリックして選択し、バックエンドで整列したレイアウトを HTML として生成・表示します。結果のコードは画面に表示されません。
      </p>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="toolbar">
          <div class="plate-info">
            <div>
              <label for="plateCount">Number of Plates</label>
              <select id="plateCount">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>
            <div class="summary" id="plateSummary">Plate 1 of 1 — 0 wells selected</div>
          </div>
          <div>
            <button type="button" class="ghost" id="prevPlateBtn">Previous</button>
            <button type="button" class="ghost" id="nextPlateBtn">Next</button>
            <button type="button" class="ghost" id="clearPlateBtn">Clear</button>
          </div>
        </div>

        <h2 id="plateTitle" style="margin:0 0 1rem;">Plate 1</h2>

        <div class="well-grid">
          <div class="column-header">
            <span></span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
            <span>11</span>
            <span>12</span>
          </div>
          <div id="wellGrid"></div>
        </div>

        <div class="controls">
          <button type="button" class="ghost" id="toggleRowBtn">Toggle Row</button>
          <button type="button" class="ghost" id="toggleColumnBtn">Toggle Column</button>
        </div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <div class="summary">バックエンド整列結果</div>
          <div>
            <button type="button" class="primary" id="generateBtn">レイアウトを生成</button>
            <button type="button" class="ghost" id="downloadBtn" disabled>Download HTML</button>
          </div>
        </div>
        <p class="status" id="status">ウェルを選択して「レイアウトを生成」を押してください。</p>

        <div class="canvas-container">
          <canvas id="layoutCanvas" width="720" height="520"></canvas>
        </div>
      </section>
    </div>

    <script>
      const ROWS = ["A", "B", "C", "D", "E", "F", "G", "H"];
      const COLS = Array.from({ length: 12 }, (_, i) => i + 1);

      let plates = [createPlate(1)];
      let currentPlateIndex = 0;
      let lastHtml = "";

      const plateCountSelect = document.getElementById("plateCount");
      const plateSummary = document.getElementById("plateSummary");
      const plateTitle = document.getElementById("plateTitle");
      const wellGrid = document.getElementById("wellGrid");
      const prevPlateBtn = document.getElementById("prevPlateBtn");
      const nextPlateBtn = document.getElementById("nextPlateBtn");
      const clearPlateBtn = document.getElementById("clearPlateBtn");
      const toggleRowBtn = document.getElementById("toggleRowBtn");
      const toggleColumnBtn = document.getElementById("toggleColumnBtn");
      const generateBtn = document.getElementById("generateBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const statusEl = document.getElementById("status");
      const layoutCanvas = document.getElementById("layoutCanvas");
      const ctx = layoutCanvas.getContext("2d");

      const API_ENDPOINT = "/generate-html";

      function createPlate(index) {
        return { label: `Plate ${index}`, wells: new Set() };
      }

      function getCurrentPlate() {
        return plates[currentPlateIndex];
      }

      function resizePlateCount(count) {
        if (count > plates.length) {
          const len = plates.length;
          for (let i = len; i < count; i += 1) {
            plates.push(createPlate(i + 1));
          }
        } else if (count < plates.length) {
          plates = plates.slice(0, count);
          currentPlateIndex = Math.min(currentPlateIndex, plates.length - 1);
        }
        renderPlate();
      }

      function renderGridStructure() {
        wellGrid.innerHTML = "";
        ROWS.forEach((row) => {
          const rowDiv = document.createElement("div");
          rowDiv.className = "well-row";

          const label = document.createElement("div");
          label.className = "row-label";
          label.textContent = row;
          rowDiv.appendChild(label);

          COLS.forEach((col) => {
            const wellId = `${col}${row}`;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "well-btn";
            btn.dataset.well = wellId;
            btn.textContent = wellId;
            btn.addEventListener("click", () => toggleWell(wellId));
            rowDiv.appendChild(btn);
          });

          wellGrid.appendChild(rowDiv);
        });
      }

      function updateWellButtons() {
        const plate = getCurrentPlate();
        document.querySelectorAll(".well-btn").forEach((btn) => {
          const well = btn.dataset.well;
          if (plate.wells.has(well)) {
            btn.classList.add("selected");
          } else {
            btn.classList.remove("selected");
          }
        });
      }

      function renderPlate() {
        const plate = getCurrentPlate();
        plateTitle.textContent = plate.label;
        plateSummary.textContent = `${plate.label} — ${plate.wells.size} wells selected · Plate ${
          currentPlateIndex + 1
        } of ${plates.length}`;
        updateWellButtons();
      }

      function toggleWell(well) {
        const plate = getCurrentPlate();
        if (plate.wells.has(well)) {
          plate.wells.delete(well);
        } else {
          plate.wells.add(well);
        }
        renderPlate();
      }

      function clearCurrentPlate() {
        getCurrentPlate().wells.clear();
        renderPlate();
      }

      function promptRowToggle() {
        const row = prompt("Row letter to toggle (A-H):");
        if (!row) return;
        const letter = row.trim().toUpperCase();
        if (!ROWS.includes(letter)) {
          alert("Invalid row.");
          return;
        }
        const plate = getCurrentPlate();
        const wells = COLS.map((col) => `${col}${letter}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) {
            plate.wells.delete(well);
          } else {
            plate.wells.add(well);
          }
        });
        renderPlate();
      }

      function promptColumnToggle() {
        const col = prompt("Column number to toggle (1-12):");
        if (!col) return;
        const num = Number(col);
        if (!Number.isInteger(num) || num < 1 || num > 12) {
          alert("Invalid column.");
          return;
        }
        const plate = getCurrentPlate();
        const wells = ROWS.map((row) => `${num}${row}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) {
            plate.wells.delete(well);
          } else {
            plate.wells.add(well);
          }
        });
        renderPlate();
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#dc2626" : "#6b7280";
      }

      function buildPayload() {
        const sources = plates.map((plate, index) => ({
          plate_id: `SRC-${String(index + 1).padStart(3, "0")}`,
          wells: Array.from(plate.wells),
        }));

        const destinations = plates.map((plate, index) => ({
          plate_id: `DEST-${String(index + 1).padStart(3, "0")}`,
          rows: ROWS.length,
          cols: COLS.length,
          assignments: Array.from(plate.wells).map((well) => ({
            well,
            source_plate: sources[index].plate_id,
            source_well: well,
          })),
        }));

        const plan = destinations.flatMap((dest) =>
          dest.assignments.map((assignment) => ({
            source_plate: assignment.source_plate,
            source_well: assignment.source_well,
            destination_plate: dest.plate_id,
            destination_well: assignment.well,
          }))
        );

        return {
          title: "Plates Packing Report",
          sources,
          destinations,
          plan,
        };
      }

      async function generateLayout() {
        try {
          setStatus("バックエンドで整列中…");
          const payload = buildPayload();
          const res = await fetch(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const text = await res.text();
          if (!res.ok) {
            setStatus(`API error (${res.status})`, true);
            return;
          }
          lastHtml = text;
          downloadBtn.disabled = false;
          drawLayout(text);
          setStatus("整列完了。プレビューを更新しました。");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      function drawLayout(htmlString) {
        // 簡易パーサ: 行を取得してプレートの先頭マッピングを描画
        // 実運用では HTML をサーバー側で別 API として返すか、JSON で配置座標を返すなどを推奨。
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, "text/html");
        const table = doc.querySelector("table");
        if (!table) {
          ctx.clearRect(0, 0, layoutCanvas.width, layoutCanvas.height);
          setStatus("HTML 内にレイアウトが見つかりませんでした。", true);
          return;
        }

        const rows = Array.from(table.querySelectorAll("tbody tr"));
        const cellWidth = 46;
        const cellHeight = 46;
        const offsetX = 80;
        const offsetY = 80;

        ctx.clearRect(0, 0, layoutCanvas.width, layoutCanvas.height);
        ctx.fillStyle = "#1f2937";
        ctx.font = "20px Inter";
        ctx.fillText("Destination Plate preview", offsetX, offsetY - 20);

        // columns label
        ctx.font = "14px Inter";
        ctx.fillStyle = "#6b7280";
        COLS.forEach((col, index) => {
          ctx.fillText(
            String(col),
            offsetX + 20 + index * (cellWidth + 6),
            offsetY - 8
          );
        });

        ROWS.forEach((rowLabel, rowIndex) => {
          ctx.fillText(rowLabel, offsetX - 30, offsetY + 30 + rowIndex * (cellHeight + 6));
          COLS.forEach((_, colIndex) => {
            const x = offsetX + colIndex * (cellWidth + 6);
            const y = offsetY + rowIndex * (cellHeight + 6);
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#d1d5db";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.roundRect(x, y, cellWidth, cellHeight, 8);
            ctx.fill();
            ctx.stroke();
          });
        });

        rows.forEach((row, rowIndex) => {
          const cells = Array.from(row.querySelectorAll("td"));
          cells.forEach((cell, colIndex) => {
            const x = offsetX + colIndex * (cellWidth + 6);
            const y = offsetY + rowIndex * (cellHeight + 6);
            const text = cell.textContent.trim();
            if (text) {
              ctx.fillStyle = "#22c55e";
              ctx.beginPath();
              ctx.roundRect(x, y, cellWidth, cellHeight, 8);
              ctx.fill();

              ctx.fillStyle = "#ffffff";
              ctx.font = "12px Inter";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(text, x + cellWidth / 2, y + cellHeight / 2);
            }
          });
        });
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
      }

      function downloadHtml() {
        if (!lastHtml) return;
        const blob = new Blob([lastHtml], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "plates-report.html";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      plateCountSelect.addEventListener("change", (event) => {
        resizePlateCount(Number(event.target.value));
      });
      prevPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex === 0) return;
        currentPlateIndex -= 1;
        renderPlate();
      });
      nextPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex >= plates.length - 1) return;
        currentPlateIndex += 1;
        renderPlate();
      });
      clearPlateBtn.addEventListener("click", clearCurrentPlate);
      toggleRowBtn.addEventListener("click", promptRowToggle);
      toggleColumnBtn.addEventListener("click", promptColumnToggle);
      generateBtn.addEventListener("click", generateLayout);
      downloadBtn.addEventListener("click", downloadHtml);

      renderGridStructure();
      renderPlate();
    </script>
  </body>
</html>
