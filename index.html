<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plates Packer – Interactive Frontend</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 3vw, 2.5rem);
        color: #111827;
      }
      header {
        margin-bottom: 1.5rem;
        display: grid;
        gap: 0.5rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
      }
      .muted {
        color: #6b7280;
        font-size: 0.95rem;
      }
      main {
        display: grid;
        gap: 1.5rem;
      }
      .card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        padding: clamp(1.25rem, 2vw, 1.75rem);
      }
      .grid-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
      }
      label {
        font-weight: 600;
        margin-right: 0.75rem;
      }
      select,
      input,
      textarea {
        border-radius: 10px;
        border: 1px solid #d1d5db;
        padding: 0.55rem 0.75rem;
        font-size: 0.95rem;
        font-family: inherit;
        background: #f9fafb;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 0.65rem 1.2rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      button.primary {
        background: linear-gradient(135deg, #2563eb, #4338ca);
        color: #fff;
      }
      button.secondary {
        background: #10b981;
        color: #fff;
      }
      button.ghost {
        background: #e5e7eb;
        color: #374151;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .well-wrapper {
        margin-top: 1rem;
        display: grid;
        gap: 0.75rem;
      }
      .column-header,
      .well-row {
        display: grid;
        grid-template-columns: auto repeat(12, 1fr);
        gap: 0.4rem;
        align-items: center;
      }
      .column-header span,
      .row-label {
        font-weight: 600;
        text-align: center;
        color: #6b7280;
      }
      .row-label {
        text-align: left;
        padding-left: 0.25rem;
      }
      .well-btn {
        border-radius: 10px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 0.85rem;
        padding: 0.55rem;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      }
      .well-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(37, 99, 235, 0.18);
      }
      .well-btn.selected {
        background: #22c55e;
        color: #fff;
        border-color: #15803d;
        box-shadow: 0 8px 16px rgba(34, 197, 94, 0.35);
      }
      .plate-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      .metadata {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      .preview-layout {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      iframe {
        width: 100%;
        min-height: 360px;
        border: 1px solid #d1d5db;
        border-radius: 16px;
        background: #fff;
      }
      pre {
        background: #111827;
        color: #f9fafb;
        padding: 1rem;
        border-radius: 14px;
        font-size: 0.85rem;
        max-height: 360px;
        overflow: auto;
      }
      .stats {
        color: #6b7280;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Plates Packer</h1>
      <p class="muted">
        96 ウェルプレートのスロットをインタラクティブに選択し、FastAPI 経由で HTML レポートを生成します。ウェルをクリックすると緑色にハイライトされます。
      </p>
    </header>

    <main>
      <section class="card">
        <div class="grid-header">
          <div>
            <label for="plateCount">Number of Plates:</label>
            <select id="plateCount">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="stats" id="selectionStats">0 wells selected (Plate 1 of 1)</div>
          <div>
            <button type="button" class="ghost" id="prevPlateBtn">Previous Plate</button>
            <button type="button" class="ghost" id="nextPlateBtn">Next Plate</button>
          </div>
        </div>

        <h2 id="plateTitle" style="margin-top:1.25rem;">Plate 1</h2>

        <div class="well-wrapper">
          <div class="column-header">
            <span></span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
            <span>11</span>
            <span>12</span>
          </div>
          <div id="wellGrid"></div>
        </div>

        <div class="plate-toolbar">
          <button type="button" class="ghost" id="clearPlateBtn">Clear Plate</button>
          <button type="button" class="ghost" id="fillRowBtn">Toggle Row</button>
          <button type="button" class="ghost" id="fillColumnBtn">Toggle Column</button>
        </div>
      </section>

      <section class="card">
        <h2>Report Metadata</h2>
        <div class="metadata">
          <div>
            <label for="titleInput">Report title</label>
            <input id="titleInput" value="QC Packing Run" />
          </div>
          <div>
            <label for="analystInput">Analyst (optional)</label>
            <input id="analystInput" placeholder="Analyst name" />
          </div>
        </div>
        <div style="margin-top:1rem;">
          <label for="notesInput">Notes</label>
          <textarea id="notesInput" placeholder="Experiment notes, protocol references, etc."></textarea>
        </div>

        <div class="plate-toolbar" style="margin-top:1.25rem;">
          <button type="button" class="primary" id="generateBtn">Generate HTML via API</button>
          <button type="button" class="secondary" id="downloadBtn" disabled>Download HTML</button>
        </div>
        <p class="stats" id="status"></p>
      </section>

      <section class="card">
        <h2>Preview & Response</h2>
        <div class="preview-layout">
          <iframe id="previewFrame" title="HTML preview"></iframe>
          <pre id="responseLog">HTML レスポンスの先頭が表示されます。</pre>
        </div>
      </section>
    </main>

    <script>
      const ROWS = ["A", "B", "C", "D", "E", "F", "G", "H"];
      const COLS = Array.from({ length: 12 }, (_, i) => i + 1);

      let plates = [createPlate(1)];
      let currentPlateIndex = 0;
      let lastHtml = "";

      const plateCountSelect = document.getElementById("plateCount");
      const plateTitle = document.getElementById("plateTitle");
      const selectionStats = document.getElementById("selectionStats");
      const wellGrid = document.getElementById("wellGrid");
      const prevPlateBtn = document.getElementById("prevPlateBtn");
      const nextPlateBtn = document.getElementById("nextPlateBtn");
      const clearPlateBtn = document.getElementById("clearPlateBtn");
      const fillRowBtn = document.getElementById("fillRowBtn");
      const fillColumnBtn = document.getElementById("fillColumnBtn");
      const titleInput = document.getElementById("titleInput");
      const analystInput = document.getElementById("analystInput");
      const notesInput = document.getElementById("notesInput");
      const generateBtn = document.getElementById("generateBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const statusEl = document.getElementById("status");
      const previewFrame = document.getElementById("previewFrame");
      const responseLog = document.getElementById("responseLog");

      const API_ENDPOINT = "/generate-html";

      function createPlate(index) {
        return { id: `Plate ${index}`, wells: new Set() };
      }

      function getCurrentPlate() {
        return plates[currentPlateIndex];
      }

      function resizePlateCount(count) {
        if (count > plates.length) {
          const len = plates.length;
          for (let i = len; i < count; i += 1) {
            plates.push(createPlate(i + 1));
          }
        } else if (count < plates.length) {
          plates = plates.slice(0, count);
          currentPlateIndex = Math.min(currentPlateIndex, plates.length - 1);
        }
        renderPlate();
      }

      function renderGridStructure() {
        wellGrid.innerHTML = "";
        ROWS.forEach((rowLabel) => {
          const rowEl = document.createElement("div");
          rowEl.className = "well-row";

          const label = document.createElement("div");
          label.className = "row-label";
          label.textContent = rowLabel;
          rowEl.appendChild(label);

          COLS.forEach((col) => {
            const wellId = `${col}${rowLabel}`;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "well-btn";
            btn.textContent = `${col}${rowLabel}`;
            btn.dataset.well = wellId;
            btn.addEventListener("click", () => toggleWell(wellId));
            rowEl.appendChild(btn);
          });
          wellGrid.appendChild(rowEl);
        });
      }

      function updateWellButtons() {
        const plate = getCurrentPlate();
        document
          .querySelectorAll(".well-btn")
          .forEach((btn) => {
            const well = btn.dataset.well;
            if (plate.wells.has(well)) {
              btn.classList.add("selected");
            } else {
              btn.classList.remove("selected");
            }
          });
      }

      function renderPlate() {
        const plate = getCurrentPlate();
        plateTitle.textContent = plate.id;
        selectionStats.textContent = `${plate.wells.size} wells selected (Plate ${
          currentPlateIndex + 1
        } of ${plates.length})`;
        updateWellButtons();
      }

      function toggleWell(well) {
        const plate = getCurrentPlate();
        if (plate.wells.has(well)) {
          plate.wells.delete(well);
        } else {
          plate.wells.add(well);
        }
        renderPlate();
      }

      function clearCurrentPlate() {
        getCurrentPlate().wells.clear();
        renderPlate();
      }

      function promptRowToggle() {
        const row = prompt("Row letter to toggle (A-H):");
        if (!row) return;
        const letter = row.trim().toUpperCase();
        if (!ROWS.includes(letter)) {
          alert("Invalid row.");
          return;
        }
        const plate = getCurrentPlate();
        const wells = COLS.map((col) => `${col}${letter}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) {
            plate.wells.delete(well);
          } else {
            plate.wells.add(well);
          }
        });
        renderPlate();
      }

      function promptColumnToggle() {
        const col = prompt("Column number to toggle (1-12):");
        if (!col) return;
        const num = Number(col);
        if (!Number.isInteger(num) || num < 1 || num > 12) {
          alert("Invalid column.");
          return;
        }
        const plate = getCurrentPlate();
        const wells = ROWS.map((row) => `${num}${row}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) {
            plate.wells.delete(well);
          } else {
            plate.wells.add(well);
          }
        });
        renderPlate();
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#dc2626" : "#6b7280";
      }

      function buildPayload() {
        const sources = plates.map((plate, index) => ({
          plate_id: `SRC-${String(index + 1).padStart(3, "0")}`,
          wells: Array.from(plate.wells).sort((a, b) => {
            const [aNum, aRow] = [parseInt(a, 10), a.replace(/\d+/g, "")];
            const [bNum, bRow] = [parseInt(b, 10), b.replace(/\d+/g, "")];
            return aNum === bNum ? aRow.localeCompare(bRow) : aNum - bNum;
          }),
          description: plates.length > 1 ? `Selection from ${plate.id}` : "Selected wells",
        }));

        const destinations = plates.map((plate, index) => ({
          plate_id: `DEST-${String(index + 1).padStart(3, "0")}`,
          rows: ROWS.length,
          cols: COLS.length,
          assignments: Array.from(plate.wells).map((well) => ({
            well,
            source_plate: sources[index].plate_id,
            source_well: well,
          })),
        }));

        const plan = destinations.flatMap((dest, destIndex) =>
          dest.assignments.map((assignment) => ({
            source_plate: assignment.source_plate,
            source_well: assignment.source_well,
            destination_plate: dest.plate_id,
            destination_well: assignment.well,
          }))
        );

        return {
          title: titleInput.value.trim() || "Plates Packing Report",
          analyst: analystInput.value.trim() || undefined,
          notes: notesInput.value.trim() || undefined,
          sources,
          destinations,
          plan,
        };
      }

      async function generateHtml() {
        try {
          setStatus("Generating HTML via API…");
          const payload = buildPayload();
          const res = await fetch(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const text = await res.text();
          responseLog.textContent =
            text.slice(0, 2000) + (text.length > 2000 ? "\n… (truncated) ..." : "");
          if (!res.ok) {
            previewFrame.srcdoc = `<pre style="padding:16px;color:#dc2626;">${text}</pre>`;
            throw new Error(`API error (${res.status})`);
          }
          lastHtml = text;
          const blob = new Blob([text], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          previewFrame.src = url;
          downloadBtn.disabled = false;
          setStatus("HTML 生成に成功しました。");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      function downloadHtml() {
        if (!lastHtml) return;
        const blob = new Blob([lastHtml], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "plates-report.html";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      plateCountSelect.addEventListener("change", (event) => {
        const count = Number(event.target.value);
        resizePlateCount(count);
      });

      prevPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex === 0) return;
        currentPlateIndex -= 1;
        renderPlate();
      });

      nextPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex >= plates.length - 1) return;
        currentPlateIndex += 1;
        renderPlate();
      });

      clearPlateBtn.addEventListener("click", clearCurrentPlate);
      fillRowBtn.addEventListener("click", promptRowToggle);
      fillColumnBtn.addEventListener("click", promptColumnToggle);
      generateBtn.addEventListener("click", generateHtml);
      downloadBtn.addEventListener("click", downloadHtml);

      renderGridStructure();
      renderPlate();
    </script>
  </body>
</html>
