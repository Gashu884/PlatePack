<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        color: #0f172a;
      }
      .shell {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        gap: 1.25rem;
      }
      header {
        display: grid;
        gap: 0.35rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.4rem);
      }
      .muted {
        margin: 0;
        color: #64748b;
      }
      .cards {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 860px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
      }
      .card {
        background: #fff;
        border-radius: 18px;
        border: 1px solid #e6eefc;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 1.25rem 1.25rem;
        display: grid;
        gap: 0.8rem;
      }
      .card h2 {
        margin: 0;
        font-size: 1.2rem;
      }
      .card p {
        margin: 0;
        color: #334155;
        line-height: 1.5;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 12px;
        padding: 0.8rem 1.05rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        background: #dbeafe;
        color: #1e293b;
        width: fit-content;
      }
      .btn.secondary {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>PlatePack</h1>
        <p class="muted">プレートのwell選択 → 出力レイアウト → パッキング結果の保存</p>
      </header>

      <div class="cards">
        <section class="card">
          <h2>Plates Packer</h2>
          <p>入力プレートのwellを選択し、出力レイアウトに空well/区切り線を設定してパッキングします。</p>
          <a class="btn" href="/plates">PlatesPackerへ</a>
        </section>
        <section class="card">
          <h2>保存した結果</h2>
          <p><code>Download PNG</code>で保存した出力プレート画像を一覧できます（ブラウザ内に保存）。</p>
          <a class="btn secondary" href="/results">保存結果ページへ</a>
        </section>
      </div>
    </div>
  </body>
</html>
