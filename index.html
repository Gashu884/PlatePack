<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack HTML API Console</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 3vw, 2.5rem);
        color: #1f2937;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .muted {
        color: #6b7280;
        font-size: 0.95rem;
      }
      main {
        margin-top: 1.5rem;
        display: grid;
        gap: 1.5rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      section {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
        padding: 1.5rem;
      }
      textarea {
        width: 100%;
        min-height: 320px;
        border-radius: 12px;
        border: 1px solid #d4d4d8;
        padding: 1rem;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.9rem;
        resize: vertical;
        background: #f9fafb;
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.2rem;
        border-radius: 10px;
        border: none;
        font-size: 0.95rem;
        cursor: pointer;
        background: #1d4ed8;
        color: #fff;
        font-weight: 600;
      }
      button.secondary {
        background: #10b981;
      }
      .toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }
      iframe {
        width: 100%;
        min-height: 360px;
        border: 1px solid #d4d4d8;
        border-radius: 12px;
        background: #fff;
      }
      pre {
        background: #0f172a;
        color: #f8fafc;
        padding: 1rem;
        border-radius: 12px;
        overflow: auto;
        font-size: 0.9rem;
        max-height: 360px;
      }
      .status {
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PlatePack HTML API Console</h1>
      <p class="muted">
        JSON ペイロードを POST して即座に HTML レポートを生成します。サンプルを取得して編集するか、独自のデータを貼り付けてください。
      </p>
    </header>

    <main>
      <section>
        <h2>Request Payload</h2>
        <textarea id="payloadInput" spellcheck="false"></textarea>
        <div class="toolbar">
          <button type="button" id="loadSampleBtn">サンプルを読み込む</button>
          <button type="button" id="sendBtn" class="secondary">HTML を生成</button>
        </div>
        <p class="status" id="status"></p>
      </section>

      <section>
        <h2>Preview</h2>
        <iframe id="preview" title="HTML preview"></iframe>
      </section>

      <section>
        <h2>API Response</h2>
        <pre id="responseLog">レスポンスはここに表示されます。</pre>
      </section>
    </main>

    <script>
      const payloadInput = document.getElementById("payloadInput");
      const loadSampleBtn = document.getElementById("loadSampleBtn");
      const sendBtn = document.getElementById("sendBtn");
      const preview = document.getElementById("preview");
      const responseLog = document.getElementById("responseLog");
      const statusEl = document.getElementById("status");

      const API_BASE = "/generate-html";

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#dc2626" : "#4b5563";
      }

      async function loadSample() {
        try {
          setStatus("サンプルを取得しています…");
          const res = await fetch(`${API_BASE}/sample`);
          if (!res.ok) {
            throw new Error(`サンプル取得に失敗しました (${res.status})`);
          }
          const data = await res.json();
          payloadInput.value = JSON.stringify(data, null, 2);
          setStatus("サンプルを読み込みました。");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function sendRequest() {
        try {
          const raw = payloadInput.value.trim();
          if (!raw) {
            setStatus("JSON を入力してください。", true);
            return;
          }
          const payload = JSON.parse(raw);
          setStatus("HTML を生成しています…");
          const res = await fetch(API_BASE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const text = await res.text();
          responseLog.textContent = text.slice(0, 2000) + (text.length > 2000 ? "\n…(省略)..." : "");
          if (!res.ok) {
            preview.srcdoc = `<pre style="padding:16px;color:#dc2626;">${text}</pre>`;
            throw new Error(`API エラー (${res.status})`);
          }

          const blob = new Blob([text], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          preview.src = url;
          setStatus("HTML を生成しました。");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      loadSampleBtn.addEventListener("click", loadSample);
      sendBtn.addEventListener("click", sendRequest);

      // 初回はサンプルを自動読み込み
      loadSample();
    </script>
  </body>
</html>
