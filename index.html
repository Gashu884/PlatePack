<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plates Packer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        color: #0f172a;
      }
      header {
        margin-bottom: 1.75rem;
        display: grid;
        gap: 0.4rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.4rem);
      }
      .muted {
        color: #64748b;
        font-size: 0.95rem;
      }
      .layout {
        display: grid;
        gap: 1.8rem;
      }
      .panel {
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 28px 60px rgba(15, 23, 42, 0.1);
        padding: clamp(1.4rem, 3vw, 2.1rem);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        justify-content: space-between;
        align-items: center;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        align-items: center;
      }
      label {
        font-weight: 600;
        margin-right: 0.4rem;
      }
      select {
        border-radius: 12px;
        border: 1px solid #d4d4d8;
        padding: 0.55rem 0.9rem;
        font-family: inherit;
        background: #f9fafb;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        font-size: 0.94rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button.primary {
        background: linear-gradient(135deg, #2563eb, #4338ca);
        color: #fff;
      }
      button.ghost {
        background: #e2e8f0;
        color: #1e293b;
      }
      button.success {
        background: #10b981;
        color: #fff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .plate-summary {
        font-size: 0.95rem;
        color: #1e293b;
        margin-top: 0.5rem;
      }
      .well-grid {
        margin-top: 1.2rem;
        display: grid;
        gap: 0.75rem;
      }
      .column-header,
      .well-row {
        display: grid;
        grid-template-columns: auto repeat(12, minmax(30px, 1fr));
        gap: 0.35rem;
        align-items: center;
      }
      .column-header span,
      .row-label {
        font-weight: 600;
        text-align: center;
        color: #64748b;
      }
      .row-label {
        text-align: left;
        padding-left: 0.2rem;
      }
      .well-btn {
        border-radius: 11px;
        border: 1px solid #cbd5f5;
        background: #fff;
        font-size: 0.75rem;
        padding: 0.35rem;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
      }
      .well-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.22);
      }
      .well-btn.selected {
        background: #22c55e;
        color: #fff;
        border-color: #15803d;
        box-shadow: 0 10px 18px rgba(34, 197, 94, 0.35);
      }
      .toggle-bar {
        display: flex;
        gap: 0.6rem;
        margin-top: 1rem;
      }
      .pack-buttons {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }
      .status {
        margin-top: 1rem;
        color: #64748b;
        font-size: 0.9rem;
        min-height: 1.2rem;
      }
      .packed-section {
        display: grid;
        gap: 1.25rem;
      }
      .packed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .packed-info {
        font-size: 0.95rem;
        color: #1e293b;
        font-weight: 600;
      }
      .packed-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .packed-grid {
        overflow-x: auto;
      }
      .packed-table {
        border-collapse: collapse;
        min-width: 700px;
        width: 100%;
        background: #fff;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        border-radius: 16px;
        overflow: hidden;
      }
      .packed-table th,
      .packed-table td {
        border: 1px solid #d1d5db;
        padding: 0.55rem;
        text-align: center;
        font-size: 0.86rem;
      }
      .packed-table th {
        background: #e0f2fe;
        font-weight: 600;
      }
      .packed-cell {
        min-width: 64px;
        min-height: 46px;
      }
      .packed-cell.active {
        background: #22c55e;
        color: #fff;
        font-weight: 600;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Plates Packer</h1>
      <p class="muted">96 ウェルプレートのスロットをクリックし、パッキング結果を新しいプレートとして表示します。</p>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="toolbar">
          <div class="controls">
            <label for="plateCount">Number of Plates</label>
            <select id="plateCount">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="controls">
            <button type="button" class="ghost" id="prevPlateBtn">Previous</button>
            <button type="button" class="ghost" id="nextPlateBtn">Next</button>
            <button type="button" class="ghost" id="clearPlateBtn">Clear</button>
          </div>
        </div>

        <div class="plate-summary" id="plateSummary">Plate 1 — 0 wells selected · Plate 1 of 1</div>
        <h2 id="plateTitle" style="margin:0.9rem 0 1.1rem;">Plate 1</h2>

        <div class="well-grid">
          <div class="column-header">
            <span></span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
            <span>11</span>
            <span>12</span>
          </div>
          <div id="wellGrid"></div>
        </div>

        <div class="toggle-bar">
          <button type="button" class="ghost" id="toggleRowBtn">Toggle Row</button>
          <button type="button" class="ghost" id="toggleColumnBtn">Toggle Column</button>
        </div>

        <div class="pack-buttons">
          <button type="button" class="primary" id="packColumnBtn">Packing! (by Column)</button>
          <button type="button" class="primary" id="packRowBtn">Packing! (by Row)</button>
        </div>

        <div class="status" id="status"></div>
      </section>

      <section class="panel">
        <div class="packed-section">
          <div class="packed-header">
            <div class="packed-info" id="packedSummary">Packed Plate 0 of 0</div>
            <div class="packed-controls">
              <button type="button" class="ghost" id="prevPackedBtn" disabled>Previous</button>
              <button type="button" class="ghost" id="nextPackedBtn" disabled>Next</button>
              <button type="button" class="success" id="downloadBtn" disabled>Download HTML</button>
            </div>
          </div>
          <div class="packed-grid" id="packedGrid">
            <p class="muted">まだパッキング結果はありません。</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      const ROWS = ["A", "B", "C", "D", "E", "F", "G", "H"];
      const COLS = Array.from({ length: 12 }, (_, i) => i + 1);
      const API_ENDPOINT = "/generate-html";

      let plates = [createPlate(1)];
      let currentPlateIndex = 0;
      let packedPlates = [];
      let currentPackedIndex = 0;
      let lastHtml = "";

      const plateCountSelect = document.getElementById("plateCount");
      const plateSummary = document.getElementById("plateSummary");
      const plateTitle = document.getElementById("plateTitle");
      const wellGrid = document.getElementById("wellGrid");
      const prevPlateBtn = document.getElementById("prevPlateBtn");
      const nextPlateBtn = document.getElementById("nextPlateBtn");
      const clearPlateBtn = document.getElementById("clearPlateBtn");
      const toggleRowBtn = document.getElementById("toggleRowBtn");
      const toggleColumnBtn = document.getElementById("toggleColumnBtn");
      const packColumnBtn = document.getElementById("packColumnBtn");
      const packRowBtn = document.getElementById("packRowBtn");
      const statusEl = document.getElementById("status");
      const packedSummary = document.getElementById("packedSummary");
      const packedGrid = document.getElementById("packedGrid");
      const prevPackedBtn = document.getElementById("prevPackedBtn");
      const nextPackedBtn = document.getElementById("nextPackedBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      function createPlate(index) {
        return { label: `Plate ${index}`, wells: new Set() };
      }

      function getCurrentPlate() {
        return plates[currentPlateIndex];
      }

      function parseWell(well) {
        const match = well.match(/^([A-H])(\d{1,2})$/);
        if (!match) return null;
        return { row: match[1], col: Number(match[2]) };
      }

      function resizePlateCount(count) {
        if (count > plates.length) {
          const len = plates.length;
          for (let i = len; i < count; i += 1) {
            plates.push(createPlate(i + 1));
          }
        } else if (count < plates.length) {
          plates = plates.slice(0, count);
          currentPlateIndex = Math.min(currentPlateIndex, plates.length - 1);
        }
        renderPlate();
      }

      function renderGridStructure() {
        wellGrid.innerHTML = "";
        ROWS.forEach((row) => {
          const rowDiv = document.createElement("div");
          rowDiv.className = "well-row";
          const label = document.createElement("div");
          label.className = "row-label";
          label.textContent = row;
          rowDiv.appendChild(label);

          COLS.forEach((col) => {
            const wellId = `${row}${col}`;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "well-btn";
            btn.dataset.well = wellId;
            btn.textContent = `${col}${row}`;
            btn.addEventListener("click", () => toggleWell(wellId));
            rowDiv.appendChild(btn);
          });

          wellGrid.appendChild(rowDiv);
        });
      }

      function updateWellButtons() {
        const plate = getCurrentPlate();
        document.querySelectorAll(".well-btn").forEach((btn) => {
          const well = btn.dataset.well;
          if (plate.wells.has(well)) {
            btn.classList.add("selected");
          } else {
            btn.classList.remove("selected");
          }
        });
      }

      function renderPlate() {
        const plate = getCurrentPlate();
        plateTitle.textContent = plate.label;
        plateSummary.textContent = `${plate.label} — ${plate.wells.size} wells selected · Plate ${
          currentPlateIndex + 1
        } of ${plates.length}`;
        updateWellButtons();
      }

      function toggleWell(well) {
        const plate = getCurrentPlate();
        if (plate.wells.has(well)) {
          plate.wells.delete(well);
        } else {
          plate.wells.add(well);
        }
        renderPlate();
      }

      function clearPlate() {
        getCurrentPlate().wells.clear();
        renderPlate();
      }

      function toggleRow() {
        const row = prompt("Row letter to toggle (A-H):");
        if (!row) return;
        const letter = row.trim().toUpperCase();
        if (!ROWS.includes(letter)) {
          alert("Invalid row.");
          return;
        }
        const plate = getCurrentPlate();
        const wells = COLS.map((col) => `${letter}${col}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) plate.wells.delete(well);
          else plate.wells.add(well);
        });
        renderPlate();
      }

      function toggleColumn() {
        const col = prompt("Column number to toggle (1-12):");
        if (!col) return;
        const num = Number(col);
        if (!Number.isInteger(num) || num < 1 || num > 12) {
          alert("Invalid column.");
          return;
        }
        const plate = getCurrentPlate();
        const wells = ROWS.map((row) => `${row}${num}`);
        const allSelected = wells.every((well) => plate.wells.has(well));
        wells.forEach((well) => {
          if (allSelected) plate.wells.delete(well);
          else plate.wells.add(well);
        });
        renderPlate();
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = `status${isError ? " error" : ""}`;
      }

      function buildPayload(order) {
        const sortedSources = plates.map((plate, index) => {
          const wellsArray = Array.from(plate.wells);
          wellsArray.sort((a, b) => {
            const parsedA = parseWell(a);
            const parsedB = parseWell(b);
            if (!parsedA || !parsedB) return 0;
            if (order === "column") {
              return parsedA.col === parsedB.col
                ? parsedA.row.localeCompare(parsedB.row)
                : parsedA.col - parsedB.col;
            }
            return parsedA.row === parsedB.row
              ? parsedA.col - parsedB.col
              : parsedA.row.localeCompare(parsedB.row);
          });
          return {
            plate_id: `SRC-${String(index + 1).padStart(3, "0")}`,
            wells: wellsArray,
          };
        });

        const flattened = sortedSources.flatMap((src) =>
          src.wells.map((well) => ({ source_plate: src.plate_id, source_well: well }))
        );

        const wellsPerPlate = ROWS.length * COLS.length;
        const destinations = [];
        const orderedAssignments = [];

        flattened.forEach((item, index) => {
          const destPlateIndex = Math.floor(index / wellsPerPlate);
          const pos = index % wellsPerPlate;
          const destRowIndex =
            order === "column" ? pos % ROWS.length : Math.floor(pos / COLS.length);
          const destColIndex =
            order === "column" ? Math.floor(pos / ROWS.length) : pos % COLS.length;
          const destPlateId = `DEST-${String(destPlateIndex + 1).padStart(3, "0")}`;
          const destWell = `${ROWS[destRowIndex]}${COLS[destColIndex]}`;

          orderedAssignments.push({
            source_plate: item.source_plate,
            source_well: item.source_well,
            destination_plate: destPlateId,
            destination_well: destWell,
          });
        });

        const totalDest = Math.max(1, Math.ceil(flattened.length / wellsPerPlate));
        for (let i = 0; i < totalDest; i += 1) {
          const plateId = `DEST-${String(i + 1).padStart(3, "0")}`;
          destinations.push({
            plate_id: plateId,
            rows: ROWS.length,
            cols: COLS.length,
            assignments: orderedAssignments
              .filter((assign) => assign.destination_plate === plateId)
              .map((assign) => ({
                well: assign.destination_well,
                source_plate: assign.source_plate,
                source_well: assign.source_well,
              })),
          });
        }

        return {
          title: "Plates Packing Report",
          sources: sortedSources,
          destinations,
          plan: orderedAssignments,
        };
      }

      async function pack(order) {
        try {
          setStatus("");
          const payload = buildPayload(order);
          const selectionCount = payload.plan.length;
          if (selectionCount === 0) {
            setStatus("ウェルを選択してください。", true);
            return;
          }
          const res = await fetch(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const text = await res.text();
          if (!res.ok) {
            setStatus(`API error (${res.status})`, true);
            return;
          }
          lastHtml = text;
          downloadBtn.disabled = false;

          packedPlates = payload.destinations.map((plate) => {
            const grid = Array.from({ length: ROWS.length }, () =>
              Array.from({ length: COLS.length }, () => "")
            );
            plate.assignments.forEach((assignment) => {
              const parsed = parseWell(assignment.well);
              if (!parsed) return;
              const rowIdx = ROWS.indexOf(parsed.row);
              const colIdx = COLS.indexOf(parsed.col);
              grid[rowIdx][colIdx] = `${assignment.source_plate}-${assignment.source_well}`;
            });
            return { id: plate.plate_id, grid };
          });
          currentPackedIndex = 0;
          renderPacked();
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      function renderPacked() {
        if (packedPlates.length === 0) {
          packedSummary.textContent = "Packed Plate 0 of 0";
          packedGrid.innerHTML = "<p class='muted'>まだパッキング結果はありません。</p>";
          prevPackedBtn.disabled = true;
          nextPackedBtn.disabled = true;
          return;
        }
        const plate = packedPlates[currentPackedIndex];
        packedSummary.textContent = `${plate.id} · Packed Plate ${currentPackedIndex + 1} of ${packedPlates.length}`;

        const table = document.createElement("table");
        table.className = "packed-table";
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        headerRow.innerHTML = "<th></th>" + COLS.map((col) => `<th>${col}</th>`).join("");
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        ROWS.forEach((rowLabel, rowIndex) => {
          const tr = document.createElement("tr");
          const rowHeader = document.createElement("th");
          rowHeader.textContent = rowLabel;
          tr.appendChild(rowHeader);
          COLS.forEach((_, colIndex) => {
            const td = document.createElement("td");
            td.className = "packed-cell";
            const text = plate.grid[rowIndex][colIndex];
            if (text) {
              td.classList.add("active");
              td.textContent = text;
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        packedGrid.innerHTML = "";
        packedGrid.appendChild(table);

        prevPackedBtn.disabled = currentPackedIndex === 0;
        nextPackedBtn.disabled = currentPackedIndex >= packedPlates.length - 1;
      }

      function downloadHtml() {
        if (!lastHtml) return;
        const blob = new Blob([lastHtml], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "plates-report.html";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      // Event bindings
      plateCountSelect.addEventListener("change", (e) =>
        resizePlateCount(Number(e.target.value))
      );
      prevPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex === 0) return;
        currentPlateIndex -= 1;
        renderPlate();
      });
      nextPlateBtn.addEventListener("click", () => {
        if (currentPlateIndex >= plates.length - 1) return;
        currentPlateIndex += 1;
        renderPlate();
      });
      clearPlateBtn.addEventListener("click", clearPlate);
      toggleRowBtn.addEventListener("click", toggleRow);
      toggleColumnBtn.addEventListener("click", toggleColumn);
      packColumnBtn.addEventListener("click", () => pack("column"));
      packRowBtn.addEventListener("click", () => pack("row"));
      prevPackedBtn.addEventListener("click", () => {
        if (currentPackedIndex === 0) return;
        currentPackedIndex -= 1;
        renderPacked();
      });
      nextPackedBtn.addEventListener("click", () => {
        if (currentPackedIndex >= packedPlates.length - 1) return;
        currentPackedIndex += 1;
        renderPacked();
      });
      downloadBtn.addEventListener("click", downloadHtml);

      // Initial render
      renderGridStructure();
      renderPlate();
    </script>
  </body>
</html>
