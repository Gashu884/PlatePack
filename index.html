<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plates Packer - Frontend</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { flex: 1 1 360px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
  h1 { margin-top: 0; }
  label { display:block; font-size:12px; color:#6b7280; margin:8px 0 4px }
  input, select, textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; }
  textarea { min-height: 90px; resize: vertical; }
  .btn { padding:10px 14px; border-radius:10px; border:1px solid #d1d5db; background:#111827; color:#fff; cursor:pointer; }
  .btn.secondary { background:#10b981; border-color:#10b981; }
  .btn.ghost { background:#fff; color:#111827 }
  .toolbar { display:flex; gap:10px; flex-wrap: wrap; margin-top: 10px; }
  .preview { margin-top: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); }
  .imgbox { border: 1px dashed #d1d5db; border-radius: 12px; padding: 12px; }
  .muted { color:#6b7280; font-size: 13px; }
</style>
</head>
<body>
  <h1>Plates Packer (Frontend)</h1>
  <p class="muted">フロントで入力 → <code>/pack</code> 等のAPIを呼び出し → 結果を表示/保存します。</p>

  <div class="row">
    <div class="card" id="sourcesCard">
      <h3>ソースプレート</h3>
      <div id="sources"></div>
      <button id="addSourceBtn" class="btn ghost" type="button">＋ ソースを追加</button>
      <p class="muted">ウェル指定例: <code>A1,A2,A3</code> / <code>A1:A6</code> / <code>A1:C3</code>（矩形）</p>
    </div>

    <div class="card">
      <h3>出力設定</h3>
      <label>Rows</label><input id="dRows" type="number" value="8" min="1" max="26" />
      <label>Cols</label><input id="dCols" type="number" value="12" min="1" />
      <label>充填方向</label>
      <select id="fillDir">
        <option value="column">column（縦詰め）</option>
        <option value="row">row（横詰め）</option>
      </select>
      <label>開始ウェル</label><input id="startWell" value="A1" />
      <label>ウェル内ラベル</label>
      <select id="annotate">
        <option value="both">source_plate + source_well</option>
        <option value="source_well">source_well</option>
        <option value="source_plate">source_plate</option>
        <option value="none">none</option>
      </select>

      <div class="toolbar">
        <button id="btnPack" class="btn" type="button">/pack（JSON）</button>
        <button id="btnPng" class="btn secondary" type="button">/render.png（PNG表示）</button>
        <button id="btnTsv" class="btn ghost" type="button">/pack/tsv（保存）</button>
        <button id="btnSample" class="btn ghost" type="button">Sample</button>
      </div>
      <p id="stats" class="muted"></p>
    </div>
  </div>

  <div class="row">
    <div class="card" style="flex:1 1 100%">
      <h3>JSON レスポンス</h3>
      <pre id="jsonOut" style="white-space:pre-wrap;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-height:120px"></pre>
      <div class="preview" id="preview"></div>
    </div>
  </div>

<script>
  // ------- UI: ソースフォームを増やす -------
  const sourcesEl = document.getElementById('sources');
  const addSourceBtn = document.getElementById('addSourceBtn');
  function addSource(initial={plate_id:'Plate 1', rows:8, cols:12, order:'column', wells:'A1:A3,B1,C1'}) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:12px';
    wrap.innerHTML = `
      <div class="row" style="gap:10px">
        <div style="flex:1">
          <label>plate_id</label>
          <input class="plate" value="${initial.plate_id}"/>
        </div>
        <div style="width:100px">
          <label>rows</label>
          <input class="rows" type="number" value="${initial.rows}" min="1" max="26"/>
        </div>
        <div style="width:100px">
          <label>cols</label>
          <input class="cols" type="number" value="${initial.cols}" min="1"/>
        </div>
        <div style="width:180px">
          <label>order</label>
          <select class="order">
            <option value="row" ${initial.order==='row'?'selected':''}>row</option>
            <option value="column" ${initial.order==='column'?'selected':''}>column</option>
            <option value="given" ${initial.order==='given'?'selected':''}>given</option>
          </select>
        </div>
        <div style="width:100px;display:flex;align-items:flex-end">
          <button class="btn ghost btnDel" type="button">削除</button>
        </div>
      </div>
      <label>selected_wells</label>
      <textarea class="wells" placeholder="A1,A2,A3 / A1:A6 / A1:C3">${initial.wells||''}</textarea>
    `;
    wrap.querySelector('.btnDel').onclick = () => wrap.remove();
    sourcesEl.appendChild(wrap);
  }
  addSourceBtn.onclick = () => addSource({plate_id:`Plate ${sourcesEl.children.length+1}`, rows:8, cols:12, order:'column', wells:''});
  // デフォルトで1枚
  addSource({plate_id:'Plate 1', rows:8, cols:12, order:'column', wells:'A1,A2,A3,B1,C1,H12'});

  // ------- リクエストを構築 -------
  function buildRequest() {
    const sources = Array.from(sourcesEl.children).map((box, i) => ({
      plate_id: box.querySelector('.plate').value || `Plate ${i+1}`,
      rows: parseInt(box.querySelector('.rows').value,10) || 8,
      cols: parseInt(box.querySelector('.cols').value,10) || 12,
      selected_wells: (box.querySelector('.wells').value || '').split(/\s+/).join(','),
      order: box.querySelector('.order').value
    }));
    if (sources.length === 0) throw new Error('ソースプレートを1つ以上追加してください。');

    const destination = {
      rows: parseInt(document.getElementById('dRows').value,10) || 8,
      cols: parseInt(document.getElementById('dCols').value,10) || 12,
      fill_direction: document.getElementById('fillDir').value,
      start_well: document.getElementById('startWell').value || 'A1',
      plate_name_prefix: 'Dest'
    };
    const annotate = document.getElementById('annotate').value;

    return { sources, destination, annotate, serpentine: false };
  }

  // ------- 呼び出しボタン -------
  const jsonOut = document.getElementById('jsonOut');
  const stats   = document.getElementById('stats');
  const preview = document.getElementById('preview');

  async function callPack() {
    try {
      const payload = buildRequest();
      const res = await fetch('/pack', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const data = await res.json();
      jsonOut.textContent = JSON.stringify(data, null, 2);
      stats.textContent = `picked: ${data.stats.total_picked} / dest plates: ${data.stats.dest_plates}`;
    } catch (e) {
      alert(e.message);
    }
  }

  async function callPNG() {
    try {
      const payload = buildRequest();
      const res = await fetch('/render.png?per_row=1&cell=48&filename=plate_layout', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      preview.innerHTML = '';
      const img = document.createElement('img');
      img.src = url; img.style.maxWidth = '100%'; img.alt = 'Plate Preview';
      const box = document.createElement('div'); box.className='imgbox'; box.appendChild(img);
      preview.appendChild(box);
      // クリックでダウンロード
      img.title = 'クリックで保存';
      img.onclick = () => {
        const a = document.createElement('a');
        a.href = url; a.download = 'plate_layout.png'; a.click();
      };
    } catch (e) {
      alert(e.message);
    }
  }

  async function callTSV() {
    try {
      const payload = buildRequest();
      const res = await fetch('/pack/tsv', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const text = await res.text();
      const blob = new Blob([text], {type:'text/tab-separated-values;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'packing.tsv'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    } catch (e) {
      alert(e.message);
    }
  }

  document.getElementById('btnPack').onclick = callPack;
  document.getElementById('btnPng' ).onclick = callPNG;
  document.getElementById('btnTsv' ).onclick = callTSV;
  document.getElementById('btnSample').onclick = () => {
    // 簡易サンプル
    sourcesEl.innerHTML = '';
    addSource({plate_id:'Plate 1', rows:8, cols:12, order:'column', wells:'A1:A3,B1,C1,H12'});
    addSource({plate_id:'Plate 2', rows:8, cols:12, order:'row', wells:'C3:C5,C7'});
  };
</script>
</body>
</html>
