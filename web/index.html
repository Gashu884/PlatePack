<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plates Packer (HTML)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Plates Packer</h1>
    <div class="controls">
      <label>
        Source Plates:
        <input id="numSources" type="number" min="1" value="1" />
      </label>

      <span class="divider"></span>

      <label>
        Source Order:
        <select id="sourceOrder">
          <option value="row">row (A1→A12→B1…)</option>
          <option value="column">column (A1→H1→A2…)</option>
          <option value="given">given (クリック順)</option>
        </select>
      </label>

      <span class="divider"></span>

      <label>
        Dest Rows:
        <input id="destRows" type="number" min="1" max="26" value="8" />
      </label>
      <label>
        Dest Cols:
        <input id="destCols" type="number" min="1" value="12" />
      </label>
      <label>
        Fill:
        <select id="fillDir">
          <option value="row">row</option>
          <option value="column">column</option>
        </select>
      </label>
      <label>
        Start Well:
        <input id="startWell" type="text" value="A1" size="5" />
      </label>
      <label>
        Annotate:
        <select id="annotate">
          <option value="both">both</option>
          <option value="source_plate">source_plate</option>
          <option value="source_well">source_well</option>
          <option value="none">none</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <section class="source">
      <div class="nav">
        <button id="prevPlate" class="ghost">&laquo; Previous Plate</button>
        <div><strong id="plateTitle">Plate 1 of 1</strong></div>
        <button id="nextPlate" class="ghost">Next Plate &raquo;</button>
      </div>

      <div class="plate-settings">
        <label>
          Rows:
          <input id="srcRows" type="number" min="1" max="26" value="8" />
        </label>
        <label>
          Cols:
          <input id="srcCols" type="number" min="1" value="12" />
        </label>
        <button id="applyGrid" class="ghost">Apply Grid</button>
        <button id="clearSelection" class="ghost">Clear Selection</button>
      </div>

      <div id="grid" class="grid"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="actions">
      <button id="packRow">Packing! (by Row)</button>
      <button id="packCol">Packing! (by Column)</button>
      <button id="saveTSV" class="secondary">Save as TSV</button>
      <button id="savePNG" class="secondary">Save as PNG</button>
    </section>

    <section class="dest" id="destArea"></section>
  </main>

  <footer>
    <small>All computations run locally in your browser. No data leaves your device.</small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
