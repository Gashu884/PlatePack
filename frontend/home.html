<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polymerase Chain Republic</title>
    <style>
      :root {
        color-scheme: light;
        font-family: var(--font-ui);
        text-rendering: optimizeLegibility;

        --bg: #f3f5f7;
        --text: #182638;
        --muted: #607085;
        --panel: #ffffff;
        --border: #d5dde5;
        --shadow: 0 1px 2px rgba(24, 38, 56, 0.04), 0 6px 20px rgba(24, 38, 56, 0.04);
        --radius-lg: 13px;
        --radius-md: 10px;
        --focus: 0 0 0 3px rgba(31, 94, 159, 0.23);
        --accent: #205f9e;
      }
      body {
        margin: 0;
        padding: clamp(1.1rem, 3vw, 2rem);
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }
      #view-home .shell {
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        gap: 1.25rem;
      }
      #view-home header {
        display: grid;
        gap: 0.45rem;
        padding: 1rem 0;
      }
      #view-home h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      #view-home .muted {
        margin: 0;
        color: var(--muted);
      }
      #view-home .cards {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 860px) {
        #view-home .cards {
          grid-template-columns: 1fr 1fr;
        }
      }
      #view-home .card {
        background: var(--panel);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1.5rem;
        display: grid;
        gap: 0.8rem;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          border-color 220ms ease;
      }
      #view-home .card h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      #view-home .card p {
        margin: 0;
        color: #334155;
        line-height: 1.5;
      }
      #view-home code {
        background: rgba(0, 0, 0, 0.06);
        padding: 0.12rem 0.4rem;
        border-radius: 7px;
        font-size: 16px;
      }
      #view-home .card-link {
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        outline: none;
      }
      #view-home .card-link:hover {
        text-decoration: none;
        box-shadow: 0 2px 6px rgba(24, 38, 56, 0.06), 0 8px 22px rgba(24, 38, 56, 0.07);
        border-color: #9baec2;
      }
      #view-home .card-link:focus-visible {
        box-shadow: var(--focus);
        border-radius: var(--radius-lg);
      }
      @media (prefers-reduced-motion: reduce) {
        #view-home .card {
          transition: none;
        }
        #view-home .card-link:hover .card {
          transform: none;
        }
      }
    </style>
    <link rel="stylesheet" href="/assets/database.css" />
    <link rel="stylesheet" href="/assets/typography.css?v=1" />
    <link rel="stylesheet" href="/assets/project-home.css" />
  <link rel="stylesheet" href="/assets/workspace-ui.css">
</head>
  <body>
    <section id="view-home">
      <div class="shell">
        <header>
          <h1 class="pcr-wordmark">Polymerase Chain Republic <span class="brand-abbreviation">（PCR）</span></h1>

        </header>

        <div class="browser project-finder">
          <aside class="sidebar">
            <div class="sidebar-heading"><span>メンバーとプロジェクト</span><button id="createMember" class="icon-btn" aria-label="メンバーを作成" title="メンバーを作成">＋</button></div>
            <nav id="projectTree" aria-label="メンバーとプロジェクト"></nav>
          </aside>
          <main class="content">
            <div class="navigation"><nav id="finderPath" aria-label="現在のフォルダ"></nav><label class="search"><span>検索</span><input id="projectSearch" type="search" aria-label="このフォルダ内を検索" autocomplete="off"></label></div>
            <div class="toolbar"><div class="toolbar-group"><button id="finderUp" class="btn" type="button">上のフォルダへ</button><button id="createProject" class="btn" type="button">＋ 新規プロジェクト</button><button id="newRegistration" class="btn primary" type="button" hidden>新しく登録</button><button id="importRecords" class="btn" type="button" hidden>JSONを登録</button><input id="importRecordsFile" type="file" accept=".json" hidden><button id="renameFolder" class="btn" type="button" disabled>名前変更</button><button id="openFolder" class="btn primary" type="button" disabled>開く</button></div></div>
            <nav id="workflowViews" class="workflow-views" aria-label="項目の状態" hidden><button data-state="input">入力中</button><button data-state="active" aria-pressed="true">作業中</button><button data-state="completed">編集完了</button><button data-state="hidden">非表示</button></nav>
            <p id="projectNotice" class="notice" role="status">読み込み中…</p>
            <div class="list-scroll"><table id="projectFileList" aria-label="メンバー・プロジェクト・プレート"><thead><tr><th class="name-column">名前</th><th>更新日時</th><th class="row-action">操作</th></tr></thead><tbody id="projectList"></tbody></table><p id="finderEmpty" class="empty" hidden>項目がありません</p></div>
            <footer class="browser-footer"><span id="finderCount">0件</span><button id="finderRefresh" class="text-btn" type="button">更新</button></footer>
          </main>
        </div>
      </div>
    </section>
  <script src="/assets/storage.js"></script>
  <script src="/assets/projects.js"></script>
  <script src="/assets/plate-editor-core.js"></script>
  <script src="/assets/workflow-core.js"></script>
  <script src="/assets/workflow-api.js"></script>
  <script src="/assets/project-home.js"></script>
  <script src="/assets/workspace-ui.js"></script>
</body>
</html>
