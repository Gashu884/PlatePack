<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-rendering: optimizeLegibility;

        --bg: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --panel: rgba(255, 255, 255, 0.8);
        --panel-solid: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.12);
        --radius-lg: 18px;
        --radius-md: 14px;
        --focus: 0 0 0 4px rgba(99, 102, 241, 0.22);
        --accent: #6366f1;
        --accent2: #22d3ee;
      }
      body {
        margin: 0;
        padding: clamp(1.1rem, 3vw, 2rem);
        color: var(--text);
        background:
          radial-gradient(900px 520px at 10% -10%, rgba(99, 102, 241, 0.18), transparent 60%),
          radial-gradient(780px 460px at 105% 0%, rgba(34, 211, 238, 0.14), transparent 55%),
          var(--bg);
      }
      #view-home .shell {
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        gap: 1.25rem;
      }
      #view-home header {
        display: grid;
        gap: 0.45rem;
      }
      #view-home h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.4rem);
        letter-spacing: -0.02em;
      }
      #view-home .muted {
        margin: 0;
        color: var(--muted);
      }
      #view-home .cards {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 860px) {
        #view-home .cards {
          grid-template-columns: 1fr 1fr;
        }
      }
      #view-home .card {
        background: var(--panel);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1.2rem 1.25rem;
        display: grid;
        gap: 0.8rem;
        backdrop-filter: blur(10px);
        transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
      }
      #view-home .card h2 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: -0.01em;
      }
      #view-home .card p {
        margin: 0;
        color: #334155;
        line-height: 1.5;
      }
      #view-home code {
        background: rgba(15, 23, 42, 0.06);
        padding: 0.12rem 0.38rem;
        border-radius: 10px;
        font-size: 0.95em;
      }
      #view-home .card-link {
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        outline: none;
      }
      #view-home .card-link:hover {
        text-decoration: none;
      }
      #view-home .card-link:hover .card {
        transform: translateY(-2px);
        box-shadow: 0 26px 60px rgba(2, 6, 23, 0.14);
        border-color: rgba(99, 102, 241, 0.25);
      }
      #view-home .card-link:focus-visible {
        box-shadow: var(--focus);
        border-radius: calc(var(--radius-lg) + 6px);
      }
      @media (prefers-reduced-motion: reduce) {
        #view-home .card {
          transition: none;
        }
        #view-home .card-link:hover .card {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <section id="view-home">
      <div class="shell">
        <header>
          <h1>PlatePack</h1>
          <p class="muted">プレートのwell選択 → 出力レイアウト → パッキング結果の保存</p>
        </header>

        <div class="cards">
          <a class="card card-link" href="/plates">
            <h2>Packer</h2>
            <p>入力プレートのwellを選択し、出力レイアウトに空well/区切り線を設定してパッキングします。</p>
          </a>
          <a class="card card-link" href="/results">
            <h2>Database</h2>
            <p><code>Save Log</code>で保存した入力/出力レイアウト設定を一覧・読み込みできます。</p>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
