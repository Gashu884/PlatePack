<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Cambria", Georgia, "Hiragino Sans", "Yu Gothic", serif;
        text-rendering: optimizeLegibility;

        --bg: #f3f5f7;
        --text: #182638;
        --muted: #607085;
        --panel: #ffffff;
        --border: #d5dde5;
        --shadow: 0 1px 2px rgba(24, 38, 56, 0.04), 0 6px 20px rgba(24, 38, 56, 0.04);
        --radius-lg: 13px;
        --radius-md: 10px;
        --focus: 0 0 0 3px rgba(31, 94, 159, 0.23);
        --accent: #205f9e;
      }
      body {
        margin: 0;
        padding: clamp(1.1rem, 3vw, 2rem);
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }
      #view-home .shell {
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        gap: 1.25rem;
      }
      #view-home header {
        display: grid;
        gap: 0.45rem;
        padding: 1rem 0;
      }
      #view-home h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.4rem);
        letter-spacing: -0.02em;
      }
      #view-home .muted {
        margin: 0;
        color: var(--muted);
      }
      #view-home .cards {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 860px) {
        #view-home .cards {
          grid-template-columns: 1fr 1fr;
        }
      }
      #view-home .card {
        background: var(--panel);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1.5rem;
        display: grid;
        gap: 0.8rem;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          border-color 220ms ease;
      }
      #view-home .card h2 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: -0.01em;
      }
      #view-home .card p {
        margin: 0;
        color: #334155;
        line-height: 1.5;
      }
      #view-home code {
        background: rgba(0, 0, 0, 0.06);
        padding: 0.12rem 0.4rem;
        border-radius: 7px;
        font-size: 0.95em;
      }
      #view-home .card-link {
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        outline: none;
      }
      #view-home .card-link:hover {
        text-decoration: none;
        box-shadow: 0 2px 6px rgba(24, 38, 56, 0.06), 0 8px 22px rgba(24, 38, 56, 0.07);
        border-color: #9baec2;
      }
      #view-home .card-link:focus-visible {
        box-shadow: var(--focus);
        border-radius: var(--radius-lg);
      }
      @media (prefers-reduced-motion: reduce) {
        #view-home .card {
          transition: none;
        }
        #view-home .card-link:hover .card {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <section id="view-home">
      <div class="shell">
        <header>
          <h1>PlatePack</h1>
          <p class="muted">プレートのwell選択 → 出力レイアウト → パッキング結果の保存</p>
        </header>

        <div class="cards">
          <a class="card card-link" href="/plates">
            <h2>Packer</h2>
            <p>入力プレートのwellを選択し、出力レイアウトに空well/区切り線を設定してパッキングします。</p>
          </a>
          <a class="card card-link" href="/results">
            <h2>Database</h2>
            <p><code>Save Log</code>で保存した入力/出力レイアウト設定を一覧・読み込みできます。</p>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
