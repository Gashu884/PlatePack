<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack - Database</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        color: #0f172a;
        background: #ffffff;
      }
      header {
        display: grid;
        gap: 0.45rem;
      }
      .page-title-link {
        color: inherit;
        text-decoration: none;
      }
      .page-title-link:hover {
        text-decoration: underline;
        text-decoration-thickness: 3px;
        text-underline-offset: 6px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.95rem;
        color: #64748b;
      }
      .breadcrumb a {
        color: inherit;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        color: #0f172a;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .breadcrumb .sep {
        opacity: 0.6;
      }
      .page-subtitle {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 800;
        color: #0f172a;
      }
      .muted {
        color: #64748b;
        font-size: 0.95rem;
      }
      #view-logs header {
        max-width: 1100px;
        margin: 0 auto 1.25rem;
        display: grid;
        gap: 0.5rem;
      }
      #view-logs h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.4vw, 2.1rem);
      }
      #view-logs .muted {
        margin: 0;
        color: #64748b;
        line-height: 1.4;
      }
      #view-logs .notice {
        padding: 0.75rem 0.9rem;
        border-radius: 0;
        background: #f3f4f6;
        border: 1px solid #9ca3af;
        color: #0f172a;
        line-height: 1.4;
        font-size: 0.95rem;
      }
      #view-logs .toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        border: 1px solid #9ca3af;
        border-radius: 0;
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #e5e7eb;
        color: #111827;
      }
      .btn.secondary {
        background: #e5e7eb;
      }
      .btn.danger {
        background: #e5e7eb;
        color: #111827;
      }
      .ghost-btn {
        border: 1px solid #9ca3af;
        border-radius: 0;
        height: 30px;
        min-height: 30px;
        padding: 0 0.6rem;
        line-height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #e5e7eb;
        color: #111827;
        font-weight: 600;
        font-size: 18px;
        cursor: pointer;
      }
      #view-logs .panel {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 0;
        border: 1px solid #9ca3af;
        box-shadow: none;
        padding: 1rem;
      }
      #view-logs .grid {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 720px) {
        #view-logs .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1040px) {
        #view-logs .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      #view-logs .item {
        border: 1px solid #9ca3af;
        border-radius: 0;
        overflow: hidden;
        display: grid;
        background: #fff;
      }
      #view-logs details.item {
        display: block;
      }
      #view-logs summary.item-summary {
        list-style: none;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 0.9rem;
        cursor: pointer;
      }
      #view-logs summary.item-summary::-webkit-details-marker {
        display: none;
      }
      #view-logs .badge {
        font-weight: 800;
        background: #e5e7eb;
        color: #111827;
        border-radius: 0;
        border: 1px solid #9ca3af;
        padding: 0.3rem 0.65rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #view-logs .summary-text {
        min-width: 0;
      }
      #view-logs .summary-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      #view-logs .meta {
        padding: 0 0.9rem 0.9rem;
        display: grid;
        gap: 0.75rem;
      }
      #view-logs .meta .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }
      #view-logs .title {
        font-weight: 800;
        color: #0f172a;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #view-logs .sub {
        color: #64748b;
        font-size: 0.85rem;
      }
      #view-logs .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.25rem;
      }
      #view-logs .empty {
        color: #64748b;
        padding: 1rem;
      }
      #view-logs code {
        background: #f3f4f6;
        padding: 0.05rem 0.3rem;
        border-radius: 0;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <section id="view-logs">
      <header>
        <h1><a class="page-title-link" href="/">PlatePack</a></h1>
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/">Home</a>
          <span class="sep">/</span>
          <span aria-current="page">Database</span>
        </nav>
        <p class="page-subtitle">Database</p>
        <p class="muted"><code>Packer</code> の <code>Save Log</code> で保存した入力/出力レイアウト設定を一覧できます。</p>
        <div id="notice" class="notice" style="display: none"></div>
        <div class="toolbar">
          <button type="button" class="ghost-btn" id="importBtn">Import JSON</button>
          <input type="file" id="importInput" accept="application/json,.json" style="display: none" />
          <button type="button" class="btn secondary" id="migrateBtn" style="display: none">LOCAL→DB移行</button>
        </div>
      </header>

      <main class="panel">
        <div id="list" class="grid"></div>
        <div id="empty" class="empty" style="display: none">保存されたログがありません。</div>
      </main>
    </section>
    <script type="module" src="/static/database.js"></script>
  </body>
</html>
