<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack - Database</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Cambria", Georgia, "Hiragino Sans", "Yu Gothic", serif;
        text-rendering: optimizeLegibility;

        --bg: #f3f5f7;
        --text: #182638;
        --muted: #607085;
        --panel: #ffffff;
        --border: #d5dde5;
        --shadow: 0 1px 2px rgba(24, 38, 56, 0.04), 0 6px 20px rgba(24, 38, 56, 0.04);
        --radius-lg: 13px;
        --radius-md: 10px;
        --radius-sm: 7px;
        --focus: 0 0 0 3px rgba(31, 94, 159, 0.23);
        --accent: #205f9e;
        --accent-pressed: #174a7d;
        --danger: #c9342d;
      }
      body {
        margin: 0;
        padding: clamp(1.1rem, 3vw, 2rem);
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }
      header {
        display: grid;
        gap: 0.45rem;
      }
      .page-title-link {
        color: inherit;
        text-decoration: none;
      }
      .page-title-link:hover {
        text-decoration: underline;
        text-decoration-thickness: 3px;
        text-underline-offset: 6px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.95rem;
        color: var(--muted);
      }
      .breadcrumb a {
        color: inherit;
        text-decoration: none;
      }
      .breadcrumb a:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .breadcrumb .sep {
        opacity: 0.6;
      }
      .page-subtitle {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--text);
      }
      .muted {
        color: var(--muted);
        font-size: 0.95rem;
      }
      #view-logs header {
        max-width: 1100px;
        margin: 0 auto 1.25rem;
        display: grid;
        gap: 0.5rem;
      }
      #view-logs h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.4vw, 2.1rem);
      }
      #view-logs .muted {
        margin: 0;
        color: var(--muted);
        line-height: 1.4;
      }
      #view-logs .notice {
        padding: 0.75rem 0.9rem;
        border-radius: var(--radius-md);
        background: rgba(0, 113, 227, 0.08);
        border: 1px solid rgba(0, 113, 227, 0.16);
        color: var(--text);
        line-height: 1.4;
        font-size: 0.95rem;
      }
      #view-logs .toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.85);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background 160ms ease, border-color 160ms ease;
      }
      .btn:hover {
        box-shadow: 0 1px 3px rgba(24, 38, 56, 0.08);
        border-color: #9baec2;
        background: #f3f7fb;
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:focus-visible {
        outline: none;
        box-shadow: var(--focus);
      }
      .btn.secondary {
        background: rgba(255, 255, 255, 0.85);
      }
      .btn.danger {
        background: #ffffff;
        border-color: rgba(201, 52, 45, 0.30);
        color: #c9342d;
      }
      .ghost-btn {
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        height: 30px;
        min-height: 30px;
        padding: 0 0.6rem;
        line-height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.85);
        color: var(--text);
        font-weight: 600;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background 160ms ease, border-color 160ms ease;
      }
      .ghost-btn:hover {
        box-shadow: 0 1px 3px rgba(24, 38, 56, 0.08);
        border-color: #9baec2;
        background: #f3f7fb;
      }
      .ghost-btn:focus-visible {
        outline: none;
        box-shadow: var(--focus);
      }
      #view-logs .panel {
        max-width: 1100px;
        margin: 0 auto;
        background: var(--panel);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1rem;
      }
      #view-logs .grid {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 720px) {
        #view-logs .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1040px) {
        #view-logs .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      #view-logs .item {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: grid;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(24, 38, 56, 0.04);
      }
      #view-logs details.item {
        display: block;
      }
      #view-logs summary.item-summary {
        list-style: none;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 0.9rem;
        cursor: pointer;
      }
      #view-logs summary.item-summary::-webkit-details-marker {
        display: none;
      }
      #view-logs .badge {
        font-weight: 800;
        background: rgba(0, 113, 227, 0.08);
        color: #1e293b;
        border-radius: 7px;
        border: 1px solid rgba(0, 113, 227, 0.16);
        padding: 0.3rem 0.65rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #view-logs .summary-text {
        min-width: 0;
      }
      #view-logs .summary-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      #view-logs .meta {
        padding: 0 0.9rem 0.9rem;
        display: grid;
        gap: 0.75rem;
      }
      #view-logs .meta .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }
      #view-logs .title {
        font-weight: 800;
        color: var(--text);
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #view-logs .sub {
        color: var(--muted);
        font-size: 0.85rem;
      }
      #view-logs .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.25rem;
      }
      #view-logs .empty {
        color: var(--muted);
        padding: 1rem;
      }
      #view-logs code {
        background: rgba(0, 0, 0, 0.06);
        padding: 0.12rem 0.4rem;
        border-radius: 7px;
        font-size: 0.95em;
      }
      @media (prefers-reduced-motion: reduce) {
        .btn,
        .ghost-btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <section id="view-logs">
      <header>
        <h1><a class="page-title-link" href="/">PlatePack</a></h1>
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/">Home</a>
          <span class="sep">/</span>
          <span aria-current="page">Database</span>
        </nav>
        <p class="page-subtitle">Database</p>
        <p class="muted"><code>Packer</code> の <code>Save Log</code> で保存した入力/出力レイアウト設定を一覧できます。</p>
        <div id="notice" class="notice" style="display: none"></div>
        <div class="toolbar">
          <button type="button" class="ghost-btn" id="importBtn">Import JSON</button>
          <input type="file" id="importInput" accept="application/json,.json" style="display: none" />
          <button type="button" class="btn secondary" id="migrateBtn" style="display: none">LOCAL→DB移行</button>
        </div>
      </header>

      <main class="panel">
        <div id="list" class="grid"></div>
        <div id="empty" class="empty" style="display: none">保存されたログがありません。</div>
      </main>
    </section>

    <script src="/assets/storage.js?v=2"></script>
    <script>
      (function () {
        const API_LIST = "/api/logs";
        const API_ITEM = (id) => `/api/logs/${encodeURIComponent(id)}`;
        const listEl = document.getElementById("list");
        const emptyEl = document.getElementById("empty");
        const noticeEl = document.getElementById("notice");
        const importBtn = document.getElementById("importBtn");
        const importInput = document.getElementById("importInput");
        const migrateBtn = document.getElementById("migrateBtn");
        const storage = window.PlatePackStorage;

        if (!listEl || !emptyEl || !importBtn || !importInput) {
          return;
        }

        function formatDate(iso) {
          try {
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString();
          } catch {
            return iso;
          }
        }

        function errorMessage(error) {
          return error instanceof Error ? error.message : String(error || "保存処理に失敗しました。");
        }

        async function listLocalLogs() {
          return await storage.readLogs();
        }

        async function writeLocalLogs(items) {
          return await storage.writeLogs(items);
        }

        async function saveLocalLog(name, payload) {
          return await storage.saveLog(name, payload);
        }

        async function getLocalLog(id) {
          return await storage.getLog(id);
        }

        function canonicalJson(value) {
          function sort(item) {
            if (Array.isArray(item)) return item.map(sort);
            if (item && typeof item === "object") {
              return Object.fromEntries(Object.keys(item).sort().map(key => [key, sort(item[key])]));
            }
            return item;
          }
          return JSON.stringify(sort(value));
        }

        function validatePayload(payload) {
          if (!payload || !Array.isArray(payload.plates) || !payload.plates.length || payload.plates.length > 999) {
            throw new Error("PlatePackのJSON形式を確認してください。プレート情報が必要です。");
          }
          const isWell = well => typeof well === "string" && /^[A-H]([1-9]|1[0-2])$/.test(well);
          const isWeek = week => Number.isInteger(week) && week >= 1 && week <= 5;
          payload.plates.forEach(plate => {
            if (!plate || !Array.isArray(plate.wells) || !plate.wells.every(isWell)) {
              throw new Error("ウェル情報が不正です。");
            }
            if (plate.growthWeeks !== undefined && (!plate.growthWeeks || typeof plate.growthWeeks !== "object" || Array.isArray(plate.growthWeeks))) {
              throw new Error("週番号の形式が不正です。");
            }
            Object.entries(plate.growthWeeks || {}).forEach(([well, week]) => {
              if (!isWell(well) || !isWeek(week)) throw new Error("週番号は1〜5を指定してください。");
            });
          });
          if (payload.packedPlates !== undefined) {
            if (!Array.isArray(payload.packedPlates)) throw new Error("パック結果が不正です。");
            payload.packedPlates.forEach(plate => {
              if (!plate || !Array.isArray(plate.grid) || plate.grid.length !== 8 ||
                  !plate.grid.every(row => Array.isArray(row) && row.length === 12)) {
                throw new Error("パック結果のサイズが不正です。");
              }
              plate.grid.flat().forEach(cell => {
                if (cell && (!isWell(cell.sourceWell) || typeof cell.sourcePlate !== "string" ||
                    (cell.growthWeek != null && !isWeek(cell.growthWeek)))) {
                  throw new Error("パック結果のウェル情報が不正です。");
                }
              });
            });
          }
          return payload;
        }

        async function deleteLog(source, id) {
          if (source === "local") {
            await storage.deleteLog(id);
            return;
          }
          const res = await fetch(API_ITEM(id), { method: "DELETE" });
          if (!res.ok) throw new Error(`DBから削除できません。HTTP ${res.status}`);
        }

        async function createServerLog(name, payload) {
          const created = await storage.fetchJson(API_LIST, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, payload }),
          });
          if (!created?.id) throw new Error("DB保存の確認に失敗しました。");
          const verified = await storage.fetchJson(API_ITEM(created.id));
          if (canonicalJson(verified?.payload) !== canonicalJson(payload)) {
            throw new Error("DBの保存内容が一致しません。LOCALのコピーを保持しています。");
          }
          return created;
        }

        async function migrateLocalToDb(entry) {
          if (!entry?.id || !entry.payload) throw new Error("移行するログが見つかりません。");
          await createServerLog(entry.name || "Log", entry.payload);
          await storage.deleteLog(entry.id);
        }

        async function migrateAllLocalToDb() {
          if (!confirm("LOCALログをDBへ移行します（成功したものはLOCALから削除されます）。よろしいですか？")) return;
          migrateBtn.disabled = true;
          migrateBtn.textContent = "移行中…";
          try {
            const local = await listLocalLogs();
            let ok = 0;
            const errors = [];
            for (const item of local) {
              try {
                await migrateLocalToDb(item);
                ok += 1;
              } catch (error) {
                errors.push(errorMessage(error));
              }
            }
            await render();
            showNotice(`移行を確認しました: ${ok}/${local.length} 件。` +
              (errors.length ? `未移行のLOCALログを保持しています。${errors[0]}` : ""));
          } catch (error) {
            showNotice(`移行に失敗しました。LOCALログを保持しています。${errorMessage(error)}`);
          } finally {
            migrateBtn.disabled = false;
            migrateBtn.textContent = "LOCAL→DB移行";
          }
        }

        async function downloadLog(source, id, name) {
          let payload = null;
          if (source === "local") {
            payload = (await getLocalLog(id))?.payload || null;
          } else {
            const data = await storage.fetchJson(API_ITEM(id));
            payload = data?.payload || null;
          }
          if (!payload) throw new Error("ダウンロードするログが見つかりません。");
          const blob = new Blob([JSON.stringify({ name: name || "Log", payload }, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `${String(name || "log").replaceAll(/[\\\\/:*?\"<>|]/g, "_")}.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }

        async function importJsonFile(file) {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const payload = validatePayload(parsed?.payload || parsed);
          const name = (typeof parsed?.name === "string" && parsed.name.trim()) || file.name.replace(/\.json$/i, "") || "Imported";
          const results = await Promise.allSettled([saveLocalLog(name, payload), createServerLog(name, payload)]);
          const localSaved = results[0].status === "fulfilled";
          const serverSaved = results[1].status === "fulfilled";
          if (!localSaved && !serverSaved) {
            throw new Error(`保存できません。JSONファイルを保管してください。${errorMessage(results[0].reason)} ${errorMessage(results[1].reason)}`);
          }
          if (localSaved && serverSaved) return "JSONを読み込み、DBとこのブラウザへの保存を確認しました。";
          if (localSaved) return `このブラウザへの保存を確認しました。DB保存は失敗しています。${errorMessage(results[1].reason)} JSONファイルも保管してください。`;
          return `DBへの保存を確認しました。ブラウザ保存は失敗しています。${errorMessage(results[0].reason)} JSONファイルも保管してください。`;
        }

        function showNotice(message) {
          if (!noticeEl) return;
          noticeEl.textContent = message;
          noticeEl.style.display = message ? "block" : "none";
        }

        async function fetchServerLogs(limit = 60) {
          const logs = await storage.fetchJson(`${API_LIST}?limit=${encodeURIComponent(String(limit))}`);
          if (!Array.isArray(logs)) throw new Error("DBの一覧形式が不正です。");
          return logs;
        }

        async function serverStatusOk() {
          try {
            const response = await fetch(`${API_LIST}?limit=1`);
            return response.ok;
          } catch {
            return false;
          }
        }

        function normalizeItems(serverLogs, localLogs) {
          const serverItems = Array.isArray(serverLogs) ? serverLogs : [];
          const localItems = Array.isArray(localLogs) ? localLogs : [];
          const mappedServer = serverItems
            .filter((x) => x && typeof x === "object" && typeof x.id === "string")
            .map((x) => ({ ...x, source: "db" }));
          const mappedLocal = localItems
            .filter((x) => x && typeof x === "object" && typeof x.id === "string")
            .map((x) => ({ ...x, source: "local" }));
          return [...mappedServer, ...mappedLocal].sort((a, b) =>
            String(b.created_at || "").localeCompare(String(a.created_at || ""))
          );
        }

        function renderEmpty(show) {
          emptyEl.style.display = show ? "block" : "none";
        }

        function renderList(items, serverOk) {
          listEl.innerHTML = "";
          if (!items.length) {
            renderEmpty(true);
            return;
          }
          renderEmpty(false);

          items.forEach((item) => {
            const card = document.createElement("details");
            card.className = "item";

            const summary = document.createElement("summary");
            summary.className = "item-summary";

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = item?.source === "local" ? "LOCAL" : "DB";

            const summaryText = document.createElement("div");
            summaryText.className = "summary-text";

            const title = document.createElement("div");
            title.className = "title";
            title.textContent = item?.name || "Log";

            const sub = document.createElement("div");
            sub.className = "sub";
            sub.textContent = item?.created_at ? formatDate(item.created_at) : "";

            summaryText.appendChild(title);
            summaryText.appendChild(sub);

            const summaryActions = document.createElement("div");
            summaryActions.className = "summary-actions";

            const expandBtn = document.createElement("button");
            expandBtn.type = "button";
            expandBtn.className = "btn secondary";
            expandBtn.textContent = "展開";
            expandBtn.addEventListener("click", (ev) => {
              ev.preventDefault();
              card.open = !card.open;
            });

            summaryActions.appendChild(expandBtn);

            summary.appendChild(badge);
            summary.appendChild(summaryText);
            summary.appendChild(summaryActions);

            const meta = document.createElement("div");
            meta.className = "meta";

            const actions = document.createElement("div");
            actions.className = "actions";

            const open = document.createElement("a");
            open.className = "btn";
            open.href =
              item?.source === "local"
                ? `/plates?log=${encodeURIComponent(`local:${item?.id || ""}`)}`
                : `/plates?log=${encodeURIComponent(item?.id || "")}`;
            open.textContent = "Packerで開く";

            const dl = document.createElement("button");
            dl.type = "button";
            dl.className = "btn secondary";
            dl.textContent = "Download JSON";
            dl.addEventListener("click", async () => {
              try {
                await downloadLog(item?.source, item?.id, item?.name);
              } catch (error) {
                showNotice(`ダウンロードに失敗しました。${errorMessage(error)}`);
              }
            });

            let mig = null;
            if (item?.source === "local" && serverOk) {
              mig = document.createElement("button");
              mig.type = "button";
              mig.className = "btn secondary";
              mig.textContent = "DBへ移行";
              mig.addEventListener("click", async () => {
                if (!confirm("このLOCALログをDBへ移行します。よろしいですか？")) return;
                mig.disabled = true;
                try {
                  const entry = await getLocalLog(item?.id);
                  if (!entry) throw new Error("ログが見つかりません。");
                  await migrateLocalToDb(entry);
                  await render();
                  showNotice("DBの保存内容を確認し、移行しました。");
                } catch (error) {
                  showNotice(`移行に失敗しました。LOCALログを保持しています。${errorMessage(error)}`);
                } finally {
                  mig.disabled = false;
                }
              });
            }

            const del = document.createElement("button");
            del.type = "button";
            del.className = "btn danger";
            del.textContent = "Delete";
            del.addEventListener("click", async () => {
              if (!confirm("削除します。よろしいですか？")) return;
              try {
                await deleteLog(item?.source, item?.id);
                await render();
              } catch (error) {
                showNotice(`削除に失敗しました。${errorMessage(error)}`);
              }
            });

            actions.appendChild(open);
            actions.appendChild(dl);
            if (mig) actions.appendChild(mig);
            actions.appendChild(del);

            meta.appendChild(actions);

            card.appendChild(summary);
            card.appendChild(meta);
            listEl.appendChild(card);
          });
        }

        async function render() {
          const results = await Promise.allSettled([fetchServerLogs(200), listLocalLogs()]);
          const ok = results[0].status === "fulfilled";
          const localOk = results[1].status === "fulfilled";
          const serverLogs = ok ? results[0].value : [];
          const local = localOk ? results[1].value : [];
          const items = normalizeItems(serverLogs, local);
          renderList(items, ok);
          const messages = [];
          if (!ok) {
            messages.push(`DBへ接続できません。利用可能なLOCALログを表示します。${errorMessage(results[0].reason)}`);
          }
          if (!localOk) messages.push(`ブラウザのログを読み込めません。保存済みデータを保護しています。${errorMessage(results[1].reason)}`);
          if (!items.length && (!ok || !localOk)) {
            emptyEl.textContent = "保存先の読み込みを確認してください。JSONバックアップからの読み込みも利用できます。";
          } else {
            emptyEl.textContent = "保存されたログがありません。";
          }
          showNotice(messages.join(" "));

          if (migrateBtn) {
            migrateBtn.style.display = ok && local.length ? "inline-flex" : "none";
          }
        }

        importBtn.addEventListener("click", () => importInput.click());
        if (migrateBtn) migrateBtn.addEventListener("click", migrateAllLocalToDb);
        importInput.addEventListener("change", async () => {
          const file = importInput.files && importInput.files[0];
          importInput.value = "";
          if (!file) return;
          importBtn.disabled = true;
          try {
            const message = await importJsonFile(file);
            await render();
            showNotice(message);
          } catch (error) {
            showNotice(`JSONの読み込み/保存に失敗しました。${errorMessage(error)}`);
          } finally {
            importBtn.disabled = false;
          }
        });

        window.__platepack_logs_render = render;
        render().catch(error => showNotice(`一覧を読み込めません。${errorMessage(error)}`));
      })();
    </script>
  </body>
</html>
