<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatePack - Database</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }
      body {
        margin: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        color: #0f172a;
      }
      .muted {
        color: #64748b;
        font-size: 0.95rem;
      }
      #view-logs header {
        max-width: 1100px;
        margin: 0 auto 1.25rem;
        display: grid;
        gap: 0.5rem;
      }
      #view-logs h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.4vw, 2.1rem);
      }
      #view-logs .muted {
        margin: 0;
        color: #64748b;
        line-height: 1.4;
      }
      #view-logs .notice {
        padding: 0.75rem 0.9rem;
        border-radius: 14px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        color: #9a3412;
        line-height: 1.4;
        font-size: 0.95rem;
      }
      #view-logs .toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        border: none;
        border-radius: 12px;
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #dbeafe;
        color: #1e293b;
      }
      .btn.secondary {
        background: #e2e8f0;
      }
      .btn.danger {
        background: #fee2e2;
        color: #7f1d1d;
      }
      #view-logs .panel {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        border: 1px solid #e6eefc;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 1rem;
      }
      #view-logs .grid {
        display: grid;
        gap: 1rem;
      }
      @media (min-width: 720px) {
        #view-logs .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1040px) {
        #view-logs .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      #view-logs .item {
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        overflow: hidden;
        display: grid;
        background: #fff;
      }
      #view-logs details.item {
        display: block;
      }
      #view-logs summary.item-summary {
        list-style: none;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 0.9rem;
        cursor: pointer;
      }
      #view-logs summary.item-summary::-webkit-details-marker {
        display: none;
      }
      #view-logs .badge {
        font-weight: 800;
        background: #e2e8f0;
        color: #334155;
        border-radius: 999px;
        padding: 0.3rem 0.65rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #view-logs .summary-text {
        min-width: 0;
      }
      #view-logs .summary-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      #view-logs .meta {
        padding: 0 0.9rem 0.9rem;
        display: grid;
        gap: 0.75rem;
      }
      #view-logs .meta .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }
      #view-logs .title {
        font-weight: 800;
        color: #0f172a;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #view-logs .sub {
        color: #64748b;
        font-size: 0.85rem;
      }
      #view-logs .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.25rem;
      }
      #view-logs .empty {
        color: #64748b;
        padding: 1rem;
      }
      #view-logs code {
        background: #eef2ff;
        padding: 0.05rem 0.3rem;
        border-radius: 6px;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <section id="view-logs">
      <header>
        <h1>Database</h1>
        <p class="muted"><code>Packer</code> の <code>Save Log</code> で保存した入力/出力レイアウト設定を一覧できます。</p>
        <div id="notice" class="notice" style="display: none"></div>
        <div class="toolbar">
          <a class="btn secondary" href="/">ホームへ</a>
          <a class="btn" href="/plates">Packerへ</a>
          <button type="button" class="btn" id="importBtn">Import JSON</button>
          <input type="file" id="importInput" accept="application/json,.json" style="display: none" />
          <button type="button" class="btn secondary" id="migrateBtn" style="display: none">LOCAL→DB移行</button>
          <button type="button" class="btn danger" id="clearAllBtn">全削除</button>
        </div>
      </header>

      <main class="panel">
        <div id="list" class="grid"></div>
        <div id="empty" class="empty" style="display: none">保存されたログがありません。</div>
      </main>
    </section>

    <script>
      (function () {
        const API_LIST = "/api/logs";
        const API_ITEM = (id) => `/api/logs/${encodeURIComponent(id)}`;
        const listEl = document.getElementById("list");
        const emptyEl = document.getElementById("empty");
        const noticeEl = document.getElementById("notice");
        const clearAllBtn = document.getElementById("clearAllBtn");
        const importBtn = document.getElementById("importBtn");
        const importInput = document.getElementById("importInput");
        const migrateBtn = document.getElementById("migrateBtn");
        const LOCAL_LOG_KEY = "PLATEPACK_LOCAL_LOGS_V1";

        if (!listEl || !emptyEl || !clearAllBtn || !importBtn || !importInput) {
          return;
        }

        function formatDate(iso) {
          try {
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString();
          } catch {
            return iso;
          }
        }

        function safeParseJson(raw, fallback) {
          try {
            return JSON.parse(raw);
          } catch {
            return fallback;
          }
        }

        function listLocalLogs() {
          try {
            const raw = localStorage.getItem(LOCAL_LOG_KEY);
            const parsed = raw ? safeParseJson(raw, []) : [];
            const items = Array.isArray(parsed) ? parsed : [];
            return items.filter((x) => x && typeof x === "object" && typeof x.id === "string");
          } catch {
            return [];
          }
        }

        function writeLocalLogs(items) {
          try {
            localStorage.setItem(LOCAL_LOG_KEY, JSON.stringify(items));
          } catch {
            // ignore quota / privacy errors
          }
        }

        function saveLocalLog(name, payload) {
          const id = `${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const created_at = new Date().toISOString();
          const items = listLocalLogs();
          items.unshift({ id, name: String(name || "Log"), created_at, payload: payload || {} });
          writeLocalLogs(items.slice(0, 200));
          return { id, name: String(name || "Log"), created_at };
        }

        function getLocalLog(id) {
          const items = listLocalLogs();
          return items.find((x) => x && typeof x === "object" && x.id === id) || null;
        }

        async function deleteLog(source, id) {
          if (source === "local") {
            const next = listLocalLogs().filter((x) => x.id !== id);
            writeLocalLogs(next);
            return;
          }
          const res = await fetch(API_ITEM(id), { method: "DELETE" });
          if (!res.ok) throw new Error("delete failed");
        }

        async function createServerLog(name, payload) {
          const res = await fetch(API_LIST, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, payload }),
          });
          if (!res.ok) throw new Error("create failed");
          return await res.json();
        }

        async function migrateAllLocalToDb() {
          if (!confirm("LOCALログをDBへ移行します（成功したものはLOCALから削除されます）。よろしいですか？")) return;
          const local = listLocalLogs();
          if (!local.length) return;
          let ok = 0;
          for (const item of local) {
            try {
              await createServerLog(item?.name || "Log", item?.payload || {});
              ok += 1;
            } catch {
              // keep local copy
            }
          }
          if (ok > 0) {
            writeLocalLogs(local.slice(ok));
          }
          alert(`移行完了: ${ok}/${local.length}`);
          await render();
        }

        async function downloadLog(source, id, name) {
          let payload = null;
          if (source === "local") {
            payload = getLocalLog(id)?.payload || null;
          } else {
            const res = await fetch(API_ITEM(id));
            if (!res.ok) throw new Error("fetch failed");
            const data = await res.json();
            payload = data?.payload || null;
          }
          const blob = new Blob([JSON.stringify(payload || {}, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `${String(name || "log").replaceAll(/[\\\\/:*?\"<>|]/g, "_")}.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }

        async function importJsonFile(file) {
          const text = await file.text();
          const payload = safeParseJson(text, null);
          if (!payload || typeof payload !== "object") throw new Error("invalid json");
          const name = file.name.replace(/\\.json$/i, "") || "Imported";
          try {
            return await createServerLog(name, payload);
          } catch {
            saveLocalLog(name, payload);
            return null;
          }
        }

        function showNotice(message) {
          if (!noticeEl) return;
          noticeEl.textContent = message;
          noticeEl.style.display = message ? "block" : "none";
        }

        async function fetchServerLogs(limit = 60) {
          const res = await fetch(`${API_LIST}?limit=${encodeURIComponent(String(limit))}`);
          if (!res.ok) throw new Error("fetch list failed");
          return await res.json();
        }

        async function serverStatusOk() {
          try {
            await fetch(`${API_LIST}?limit=1`);
            return true;
          } catch {
            return false;
          }
        }

        function normalizeItems(serverLogs, localLogs) {
          const serverItems = Array.isArray(serverLogs) ? serverLogs : [];
          const localItems = Array.isArray(localLogs) ? localLogs : [];
          const mappedServer = serverItems
            .filter((x) => x && typeof x === "object" && typeof x.id === "string")
            .map((x) => ({ ...x, source: "db" }));
          const mappedLocal = localItems
            .filter((x) => x && typeof x === "object" && typeof x.id === "string")
            .map((x) => ({ ...x, source: "local" }));
          return [...mappedServer, ...mappedLocal].sort((a, b) =>
            String(b.created_at || "").localeCompare(String(a.created_at || ""))
          );
        }

        function renderEmpty(show) {
          emptyEl.style.display = show ? "block" : "none";
        }

        function renderList(items, serverOk) {
          listEl.innerHTML = "";
          if (!items.length) {
            renderEmpty(true);
            return;
          }
          renderEmpty(false);

          items.forEach((item) => {
            const card = document.createElement("details");
            card.className = "item";

            const summary = document.createElement("summary");
            summary.className = "item-summary";

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = item?.source === "local" ? "LOCAL" : "DB";

            const summaryText = document.createElement("div");
            summaryText.className = "summary-text";

            const title = document.createElement("div");
            title.className = "title";
            title.textContent = item?.name || "Log";

            const sub = document.createElement("div");
            sub.className = "sub";
            sub.textContent = item?.created_at ? formatDate(item.created_at) : "";

            summaryText.appendChild(title);
            summaryText.appendChild(sub);

            const summaryActions = document.createElement("div");
            summaryActions.className = "summary-actions";

            const expandBtn = document.createElement("button");
            expandBtn.type = "button";
            expandBtn.className = "btn secondary";
            expandBtn.textContent = "展開";
            expandBtn.addEventListener("click", (ev) => {
              ev.preventDefault();
              card.open = !card.open;
            });

            summaryActions.appendChild(expandBtn);

            summary.appendChild(badge);
            summary.appendChild(summaryText);
            summary.appendChild(summaryActions);

            const meta = document.createElement("div");
            meta.className = "meta";

            const actions = document.createElement("div");
            actions.className = "actions";

            const open = document.createElement("a");
            open.className = "btn";
            open.href =
              item?.source === "local"
                ? `/plates?log=${encodeURIComponent(`local:${item?.id || ""}`)}`
                : `/plates?log=${encodeURIComponent(item?.id || "")}`;
            open.textContent = "Packerで開く";

            const dl = document.createElement("button");
            dl.type = "button";
            dl.className = "btn secondary";
            dl.textContent = "Download JSON";
            dl.addEventListener("click", async () => {
              try {
                await downloadLog(item?.source, item?.id, item?.name);
              } catch {
                alert("ダウンロードに失敗しました。");
              }
            });

            let mig = null;
            if (item?.source === "local" && serverOk) {
              mig = document.createElement("button");
              mig.type = "button";
              mig.className = "btn secondary";
              mig.textContent = "DBへ移行";
              mig.addEventListener("click", async () => {
                if (!confirm("このLOCALログをDBへ移行します。よろしいですか？")) return;
                try {
                  const entry = getLocalLog(item?.id);
                  if (!entry) throw new Error("not found");
                  await createServerLog(entry.name || "Log", entry.payload || {});
                  const next = listLocalLogs().filter((x) => x.id !== item?.id);
                  writeLocalLogs(next);
                  await render();
                } catch {
                  alert("移行に失敗しました。");
                }
              });
            }

            const del = document.createElement("button");
            del.type = "button";
            del.className = "btn danger";
            del.textContent = "Delete";
            del.addEventListener("click", async () => {
              if (!confirm("削除します。よろしいですか？")) return;
              try {
                await deleteLog(item?.source, item?.id);
                await render();
              } catch {
                alert("削除に失敗しました。");
              }
            });

            actions.appendChild(open);
            actions.appendChild(dl);
            if (mig) actions.appendChild(mig);
            actions.appendChild(del);

            meta.appendChild(actions);

            card.appendChild(summary);
            card.appendChild(meta);
            listEl.appendChild(card);
          });
        }

        async function render() {
          let serverLogs = [];
          let ok = false;
          try {
            serverLogs = await fetchServerLogs();
            ok = true;
          } catch {
            ok = false;
          }

          const local = listLocalLogs();
          const items = normalizeItems(serverLogs, local);
          renderList(items, ok);
          if (!ok) {
            showNotice("DBへ接続できません。LOCALログのみ表示します。");
          } else {
            showNotice("");
          }

          if (migrateBtn) {
            migrateBtn.style.display = ok && local.length ? "inline-flex" : "none";
          }
        }

        clearAllBtn.addEventListener("click", () => {
          alert("全削除は未対応です（DB永続化のため）。個別に削除してください。");
        });

        importBtn.addEventListener("click", () => importInput.click());
        if (migrateBtn) migrateBtn.addEventListener("click", migrateAllLocalToDb);
        importInput.addEventListener("change", async () => {
          const file = importInput.files && importInput.files[0];
          importInput.value = "";
          if (!file) return;
          try {
            await importJsonFile(file);
            await render();
          } catch {
            alert("JSONの読み込み/保存に失敗しました。");
          }
        });

        serverStatusOk().then((ok) => {
          if (migrateBtn) migrateBtn.style.display = ok ? "inline-flex" : "none";
        });

        render();
      })();
    </script>
  </body>
</html>
