<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PlatePack - Database</title>
  <link rel="stylesheet" href="/assets/typography.css" />
  <link rel="stylesheet" href="/assets/database.css" />
</head>
<body>
  <div class="database-shell" id="view-logs">
    <header class="page-header">
      <div><a href="/" class="brand">PlatePack</a><span class="page-label">Database</span></div>
      <a class="btn primary" href="/plates">Packerを開く</a>
    </header>
    <div class="browser">
      <aside class="sidebar">
        <div class="sidebar-heading"><span>フォルダ</span><button type="button" id="newPersonBtn" class="icon-btn" title="メンバーフォルダを作成" aria-label="メンバーフォルダを作成">＋</button></div>
        <button type="button" id="rootBtn" class="tree-root"><span class="folder-icon"></span>すべてのメンバー</button>
        <div id="folderTree" role="tree" aria-label="メンバーとプロジェクト"></div>

        <div id="connectionState" class="connection-state">保存先を確認中…</div>
      </aside>
      <main class="content">
        <div class="navigation">
          <nav id="pathbar" aria-label="現在のフォルダ"></nav>
          <label class="search"><span>検索</span><input id="searchInput" type="search" placeholder="このフォルダ内を検索" autocomplete="off" /></label>
        </div>
        <div class="toolbar">
          <div class="toolbar-group">
            <button type="button" class="btn" id="newProjectBtn">＋ プロジェクト</button>
            <button type="button" class="btn" id="renameBtn">名前を変更</button>
            <button type="button" class="btn" id="importBtn">Import JSON</button>
            <input id="importInput" type="file" accept=".json,application/json" hidden />
          </div>
          <div class="toolbar-group">
            <button type="button" class="btn" id="copyBtn" disabled>コピー</button>
            <button type="button" class="btn" id="cutBtn" disabled>切り取り</button>
            <button type="button" class="btn" id="pasteBtn" disabled>ペースト</button>
            <button type="button" class="btn" id="downloadBtn" disabled>JSON保存</button>
            <button type="button" class="btn" id="migrateBtn" disabled>DBへ移行</button>
            <button type="button" class="btn danger" id="deleteBtn" disabled>削除</button>
          </div>
        </div>
        <div class="movebar">
          <span id="selectionInfo">0件</span>
          <div><label for="moveProjectSelect">移動先</label><select id="moveProjectSelect"><option value="">プロジェクトを選択</option></select><button type="button" class="btn" id="moveBtn" disabled>移動</button></div>
        </div>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div class="list-scroll">
          <table id="fileList" aria-label="フォルダとプレートデータ">
            <thead><tr>
              <th class="name-column"><button type="button" data-sort="name">名前 <span aria-hidden="true">↕</span></button></th>
              <th>種類</th><th><button type="button" data-sort="date">保存日時 <span aria-hidden="true">↕</span></button></th><th>保存先</th><th class="row-action">操作</th>
            </tr></thead>
            <tbody id="list"></tbody>
          </table>
          <div id="empty" class="empty" hidden>このフォルダにはまだデータがありません。</div>
        </div>
        <footer class="browser-footer">
          <span id="itemCount">読み込み中…</span>
          <span>ダブルクリックで開く · ドラッグで移動 · Alt/Option＋ドラッグでコピー · ⌘/Ctrl+C・X・V</span>
          <button type="button" id="refreshBtn" class="text-btn">更新</button>
        </footer>
      </main>
    </div>
  </div>
  <div id="contextMenu" class="context-menu" role="menu" hidden></div>
  <script src="/assets/storage.js?v=3"></script>
  <script src="/assets/database.js?v=3"></script>
</body>
</html>
