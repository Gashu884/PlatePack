<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymerase Chain Republic · プレート管理</title>
<link rel="stylesheet" href="/assets/typography.css"><link rel="stylesheet" href="/assets/plate-editor.css?v=workspace2"><link rel="stylesheet" href="/assets/workspace-ui.css">
<script>if(new URLSearchParams(location.search).get("embedded")==="1"&&parent!==window)document.documentElement.classList.add("embedded-plate-editor");</script></head><body>
<header><a href="/" class="brand pcr-wordmark" title="Polymerase Chain Republic" aria-label="Polymerase Chain Republic ホーム">PCR</a><h1>プレート管理</h1><a href="/results" id="databaseLink">データベース</a></header>
<main>
  <div class="toolbar"><label>プロジェクト <select id="project" aria-label="プロジェクト"></select></label><button id="refresh">更新</button><span id="recordCount"></span></div>
  <p id="notice" role="status" aria-live="polite"></p>
  <button id="reconcileOutput" hidden>入力から出力を再生成</button>
  <section id="overview"><div class="sticky-tools"><div class="toolbar"><nav id="views" aria-label="プレートの状態"><button data-view="active" aria-pressed="true">作業中</button><button data-view="completed" aria-pressed="false">編集完了</button><button data-view="hidden" aria-pressed="false">非表示</button></nav><span id="pickedCount">0枚</span><button id="editSelected" class="primary" disabled data-help="選択したプレートを編集します。一度に24枚まで。">編集</button><button id="clearSelection" disabled>選択解除</button><button id="hideSelected" disabled data-help="同じ出力プレートの過去の版も含めて非表示にします。非表示タブから戻せます。">非表示にする</button><button id="completeSelected" disabled data-help="完了を記録します。組内の全プレートが完了すると、組名_edとして編集完了一覧に移ります。一度に24枚まで。">編集完了</button><button id="restoreSelected" disabled hidden>一覧に戻す</button></div></div><div id="records"></div></section>
  <section id="editor" hidden>
    <div class="sticky-tools">
    <div class="toolbar editor-tools"><button id="back">一覧</button><h2 id="editTitle"></h2><span id="saveState"></span><button id="undo" disabled data-help="直前の操作を取り消します。Ctrl / ⌘ + Zでも戻せます。">戻す</button><button id="reset" disabled data-help="今回の編集開始時の配置に戻します。">リセット</button><button id="save" class="primary">保存</button><button id="completeBoards" disabled data-help="チェックしたプレートの完了を記録します。組内の全プレートが完了すると編集完了一覧に移ります。未保存の変更も保存します。">編集完了</button></div>
    <div class="toolbar"><button id="range" aria-pressed="false" data-help="ドラッグ、またはShift＋クリックで四角い範囲を選択します。選択後、その中のウェルをドラッグして移動します。">範囲選択</button><button id="move" disabled data-help="選択後に押し、移動先のウェルをクリックします。試料のあるウェルへは交換、範囲移動はすべて空の場所だけ可能です。">移動先を選ぶ</button><button id="delete" disabled>削除</button><button id="correctSource" disabled data-help="出力位置を保ち、選択した1ウェルの入力元を訂正します。">入力元を訂正</button><span id="selectionInfo"></span><a id="electrophoresis" hidden>ROI対応へ</a></div>
    </div>
    <div id="boards"></div>
    <details class="history"><summary>変更履歴</summary><ol id="changes"></ol></details>
  </section>
</main>
<dialog id="repackDialog" aria-labelledby="repackTitle">
  <h2 id="repackTitle">出力を再生成</h2><p id="repackSummary"></p>
  <p>入力順に詰め直します。指定した空ウェルは維持します。</p>
  <details><summary>変更位置</summary><ol id="repackChanges"></ol></details>
  <p id="repackError" role="alert"></p>
  <div class="toolbar"><button id="cancelRepack">キャンセル</button><button id="applyRepack" class="primary">再生成して保存</button></div>
</dialog>
<dialog id="sourceDialog" aria-labelledby="sourceTitle">
  <form id="sourceForm">
    <h2 id="sourceTitle">入力元を訂正</h2><p id="sourceBefore"></p>
    <label>入力プレート<select id="sourcePlate" required></select></label>
    <label>ウェル<input id="sourceWell" placeholder="F5" maxlength="3" pattern="[A-Ha-h]([1-9]|1[0-2])" required autocomplete="off"></label>
    <p id="sourceError" role="alert"></p>
    <div class="toolbar"><button type="button" id="cancelSource">キャンセル</button><button type="submit" class="primary">訂正</button></div>
  </form>
</dialog>
<script src="/assets/storage.js"></script><script src="/assets/projects.js"></script><script src="/assets/plate-editor-core.js"></script><script src="/assets/plate-editor.js?v=workspace2"></script><script src="/assets/workspace-ui.js"></script>
</body></html>
